<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>- 御触書 - 下克上 GEKOKUJO オンライン（非公式）</title>
  <link rel="stylesheet" href="css/sorry.css">
</head>
<body>
  <div class="notice-card">
    <div class="ofuregaki">御 触 書</div>

    <img class="notice-title-img" src="assets/title.png" alt="下克上オンライン">

    <div class="divider"></div>

    <div class="notice-lead">まずは戦をご覧あれ</div>

    <section class="battle-section">
      <h2 class="battle-title">足軽の戦</h2>
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/aj0gQA8EHPo"
          title="足軽の戦"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </section>

    <section class="battle-section">
      <h2 class="battle-title">農民一揆</h2>
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/ysdeuJbOXps"
          title="農民一揆"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </section>

    <section class="battle-section">
      <h2 class="battle-title">商人、辻斬りにあう</h2>
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/yiWCTwY9z6c"
          title="商人の戦"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </section>

    <div class="notice-sub">
      <b class="emphasis">原作再現</b>のため携帯端末には<br>
      対応してござらぬ<br>
      <br>
      かたじけない<br>
      <br>
      いざ参戦するなら<br>
      机上の陣（PC）にて<br>
      お越しくだされ
    </div>
  </div>
  <script src="/__/firebase/10.14.0/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.14.0/firebase-analytics-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
