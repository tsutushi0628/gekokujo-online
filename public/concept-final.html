        }
      } else if (gameState.selectedChar === "merchant") {
        // Weak: short range single shot
        ProjectileManager.add(PlayerController.x, PlayerController.y, Math.cos(angle) * 4, Math.sin(angle) * 4, damage, 15, 4, "#1a1a1a", false);
      } else {
        // Farmer: 短射程・狭範囲・単発 (blast:2, 弾速6, 寿命28)
        ProjectileManager.add(PlayerController.x, PlayerController.y, Math.cos(angle) * 6, Math.sin(angle) * 6, damage, 28, 2, "#1a1a1a", false);
      }
      PlayerController.attackCooldown = 0.25;

      // Farmer: attack hits can attract civilians (30% chance)
      if (gameState.selectedChar === "farmer" && Math.random() < 0.2) {
        CivilianManager.spawn();
      }
    }
  };

  // ============================================================
  // ProjectileManager
  // ============================================================
  var ProjectileManager = {
    projectiles: [],

    init: function() { this.projectiles = []; },

    add: function(x, y, vx, vy, damage, life, size, color, homing) {
      this.projectiles.push({ x: x, y: y, vx: vx, vy: vy, damage: damage, life: life, size: size, color: color, homing: homing });
    },

    _findNearestEnemy: function(x, y) {
      var bestDist = 99999;
      var bestEnemy = null;
      for (var i = 0; i < EnemyManager.enemies.length; i++) {
        var en = EnemyManager.enemies[i];
        if (en.surrendering) { continue; }
        var dx = en.x - x;
        var dy = en.y - y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestEnemy = en;
        }
      }
      return bestEnemy;
    },

    update: function(dt) {
      for (var i = this.projectiles.length - 1; i >= 0; i--) {
        var p = this.projectiles[i];

        // Homing: gently steer toward nearest enemy
        if (p.homing) {
          var target = this._findNearestEnemy(p.x, p.y);
          if (target) {
            var hdx = target.x - p.x;
            var hdy = target.y - p.y;
            var hDist = Math.sqrt(hdx * hdx + hdy * hdy);
            if (hDist > 1) {
              var currentSpeed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
              var desiredVx = (hdx / hDist) * currentSpeed;
              var desiredVy = (hdy / hDist) * currentSpeed;
              // Gentle turn (lerp factor 0.05)
              p.vx += (desiredVx - p.vx) * 0.05;
              p.vy += (desiredVy - p.vy) * 0.05;
              // Normalize speed
              var newSpeed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
              if (newSpeed > 0) {
                p.vx = (p.vx / newSpeed) * currentSpeed;
                p.vy = (p.vy / newSpeed) * currentSpeed;
              }
            }
          }
        }

        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0 || p.x < -20 || p.x > MAP_W + 20 || p.y < -20 || p.y > MAP_H + 20) {
          this.projectiles.splice(i, 1);
          continue;
        }

        // Hit enemies
        for (var j = EnemyManager.enemies.length - 1; j >= 0; j--) {
          var en = EnemyManager.enemies[j];
          if (en.surrendering) { continue; }
          var dx = p.x - en.x;
          var dy = p.y - en.y;
          if (Math.sqrt(dx * dx + dy * dy) < en.size + p.size) {
            en.hp -= p.damage;
            EffectRenderer.add(en.x, en.y, "hit");
            this.projectiles.splice(i, 1);
            if (en.hp <= 0) {
              ScoreManager.addRaw(en.scoreValue);
              ShoninSystem.addKokuForKill(en.scoreValue);
              EffectRenderer.add(en.x, en.y, "destroy");
              EnemyManager.enemies.splice(j, 1);
            }
            break;
          }
        }

        // Hit gekokujo boss
        if (GekokujoSystem.boss) {
          var boss = GekokujoSystem.boss;
          if (i >= 0 && i < this.projectiles.length) {
            var bp = this.projectiles[i];
            if (bp) {
              var bdx = bp.x - boss.x;
              var bdy = bp.y - boss.y;
              if (Math.sqrt(bdx * bdx + bdy * bdy) < boss.size + bp.size) {
                boss.hp -= bp.damage;
                EffectRenderer.add(boss.x, boss.y, "hit");
                this.projectiles.splice(i, 1);
                if (boss.hp <= 0) { GekokujoSystem.success(); }
              }
            }
          }
        }
      }
    },

    draw: function(ctx) {
      for (var i = 0; i < this.projectiles.length; i++) {
        var p = this.projectiles[i];
        if (!CameraController.isVisible(p.x, p.y, 10)) { continue; }
        var sp = CameraController.worldToScreen(p.x, p.y);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  };

  // ============================================================
  // TsujigiriSystem
  // ============================================================
  var TsujigiriSystem = {
    checkTimer: 0,
    phase: "idle",
    // phases: idle -> cutin -> input -> resolve
    sequenceTimer: 0,
    inputMaxTimer: 1.0,
    inputAccepted: false,
    attackerIndex: -1,

    init: function() {
      this.checkTimer = 0;
      this.phase = "idle";
      this.sequenceTimer = 0;
      this.inputMaxTimer = 1.0;
      this.inputAccepted = false;
      this.attackerIndex = -1;
    },

    update: function(dt) {
      if (this.phase === "idle") {
        this.checkTimer += dt;
        if (this.checkTimer >= 1.0) {
          this.checkTimer = 0;
          this._tryTrigger();
        }
        return;
      }

      if (this.phase === "cutin") {
        this.sequenceTimer -= dt;
        if (this.sequenceTimer <= 0) {
          this.phase = "input";
          var qteCharMult = 1.0;
          if (gameState.selectedChar === "ashigaru") { qteCharMult = 1.3; }
          if (gameState.selectedChar === "farmer") { qteCharMult = 0.8; }
          var qteTime = 1.8 * qteCharMult * (0.7 + Math.random() * 0.6);
          this.sequenceTimer = qteTime;
          this.inputMaxTimer = qteTime;
          this.inputAccepted = false;
        }
        return;
      }

      if (this.phase === "input") {
        if (InputManager.consumeSpace()) {
          this.inputAccepted = true;
          this._resolve(true);
          return;
        }
        this.sequenceTimer -= dt;
        if (this.sequenceTimer <= 0) {
          this._resolve(false);
        }
        return;
      }

      if (this.phase === "resolve") {
        this.sequenceTimer -= dt;
        if (this.sequenceTimer <= 0) {
          this.phase = "idle";
          gameState.paused = false;
        }
        return;
      }
    },

    _terrainChanceTable: {
      ashigaru: { village: 0.5, castleTown: 0.6, mountain: 0.15, grassland: 0.08 },
      merchant: { village: 1.5, castleTown: 2.0, mountain: 0.1, grassland: 0.05 },
      farmer: { village: 0.8, castleTown: 0.8, mountain: 0.2, grassland: 0.1 }
    },

    _getTerrainChanceMultiplier: function() {
      var px = PlayerController.x;
      var py = PlayerController.y;
      if (TerrainManager.isOnBridge(px, py)) { return 0; }
      if (TerrainManager.isInRiver(px, py)) { return 0; }
      var terrain = TerrainManager.getTerrainAt(px, py);
      var charTable = this._terrainChanceTable[gameState.selectedChar] || this._terrainChanceTable.farmer;
      if (terrain === TERRAIN_TYPES.MOUNTAIN) { return charTable.mountain; }
      if (terrain === TERRAIN_TYPES.VILLAGE) { return charTable.village; }
      if (terrain === TERRAIN_TYPES.CASTLE_TOWN) { return charTable.castleTown; }
      if (terrain === TERRAIN_TYPES.GRASSLAND) { return charTable.grassland; }
      return 1.0;
    },

    _tryTrigger: function() {
      for (var i = 0; i < EnemyManager.enemies.length; i++) {
        var en = EnemyManager.enemies[i];
        if (en.surrendering) { continue; }
        if (en.name === "野盗" || en.name === "侍") {
          var chance = 0.05 * this._getTerrainChanceMultiplier();
          if (Math.random() < chance) {
            this._startCutin(i);
            return;
          }
        }
      }
    },

    _startCutin: function(enemyIndex) {
      this.attackerIndex = enemyIndex;
      this.phase = "cutin";
      this.sequenceTimer = 0.8;
      gameState.paused = true;
      ConcentrationLines.show(1800);
    },

    _resolve: function(success) {
      this.phase = "resolve";
      this.sequenceTimer = 0.3;

      if (success) {
        if (this.attackerIndex >= 0 && this.attackerIndex < EnemyManager.enemies.length) {
          var en = EnemyManager.enemies[this.attackerIndex];
          EffectRenderer.add(en.x, en.y, "destroy");
          EnemyManager.enemies.splice(this.attackerIndex, 1);
        }
        ScoreManager.addRaw(100);
        ShoninSystem.addKokuForKill(100);
        AnnouncementSystem.add("見事! 辻斬り返し!");
      } else {
        // Failure: 50% HP damage
        var tsujiDamage = Math.floor(PlayerController.maxHp * 0.5);
        PlayerController.hp -= tsujiDamage;
        EffectRenderer.add(PlayerController.x, PlayerController.y, "playerHit");
        AnnouncementSystem.add("辻斬りを受けた! (-" + tsujiDamage + "HP)");
        if (PlayerController.hp <= 0) {
          PlayerController.hp = 0;
          gameState.paused = false;
          gameState.phase = "result";
          skullScreen.classList.add("active");
          this.phase = "idle";
          return;
        }
      }
    },

    draw: function(ctx) {
      if (this.phase === "cutin") {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        if (spritesLoaded) {
          drawSpriteCentered(ctx, "tsujigiri", CANVAS_W / 2, CANVAS_H / 2 - 60, 120, false);
        }
        ctx.font = FONT.h1;
        ctx.textAlign = "center";
        ctx.fillStyle = "#c03030";
        ctx.fillText("辻斬り!", CANVAS_W / 2, CANVAS_H / 2 + 30);
      }

      if (this.phase === "input") {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        if (spritesLoaded) {
          drawSpriteCentered(ctx, "tsujigiri", CANVAS_W / 2, CANVAS_H / 2 - 80, 120, false);
        }
        ctx.font = FONT.h1;
        ctx.textAlign = "center";
        ctx.fillStyle = "#c03030";
        ctx.fillText("辻斬り!", CANVAS_W / 2, CANVAS_H / 2 - 10);
        var blink = Math.sin(performance.now() * 0.01) > 0;
        if (blink) {
          ctx.fillStyle = "#ffffff";
          ctx.font = FONT.h2;
          ctx.fillText("SPACEで回避!", CANVAS_W / 2, CANVAS_H / 2 + 40);
        }
        var barWidth = 200 * (this.sequenceTimer / this.inputMaxTimer);
        ctx.fillStyle = "#c03030";
        ctx.fillRect(CANVAS_W / 2 - 100, CANVAS_H / 2 + 60, barWidth, 8);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;
        ctx.strokeRect(CANVAS_W / 2 - 100, CANVAS_H / 2 + 60, 200, 8);
      }

      if (this.phase === "resolve" && this.inputAccepted) {
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        ctx.font = FONT.h1;
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("見事!", CANVAS_W / 2, CANVAS_H / 2);
      }
    }
  };

  // ============================================================
  // IkkiSystem
  // ============================================================
  var IkkiSystem = {
    available: false,
    active: false,
    cooldown: 0,
    flashTimer: 0,

    init: function() {
      this.available = (gameState.selectedChar === "farmer");
      this.active = false;
      this.cooldown = 0;
      this.flashTimer = 0;
    },

    update: function(dt) {
      if (!this.available) { return; }

      if (this.cooldown > 0) { this.cooldown -= dt; }
      if (this.flashTimer > 0) { this.flashTimer -= dt; }

      // Q key activation is handled in the main game loop
    },

    tryActivate: function() {
      if (!this.available) { return; }
      if (this.cooldown > 0 || this.active) { return; }
      this._activate();
    },

    _activate: function() {
      var paradeLen = ParadeController.getLength();
      if (paradeLen < 1) {
        AnnouncementSystem.add("一揆には最低1人必要!");
        return;
      }

      // Consume 20% of parade members (min 1)
      var consumeCount = Math.max(1, Math.floor(paradeLen * 0.2));
      var damageAmount = paradeLen * 8;

      // Remove consumed members from the end (loop-based)
      for (var rc = 0; rc < consumeCount; rc++) {
        if (ParadeController.members.length > 0) {
          ParadeController.members.splice(ParadeController.members.length - 1, 1);
        }
      }

      // Damage enemies within 200px radius
      var ikkiRadius = 200;
      for (var i = EnemyManager.enemies.length - 1; i >= 0; i--) {
        var en = EnemyManager.enemies[i];
        if (en.surrendering) { continue; }
        var idx = en.x - PlayerController.x;
        var idy = en.y - PlayerController.y;
        if (Math.sqrt(idx * idx + idy * idy) > ikkiRadius) { continue; }
        en.hp -= damageAmount;
        EffectRenderer.add(en.x, en.y, "hit");
        if (en.hp <= 0) {
          ScoreManager.addRaw(en.scoreValue);
          ShoninSystem.addKokuForKill(en.scoreValue);
          EffectRenderer.add(en.x, en.y, "destroy");
          EnemyManager.enemies.splice(i, 1);
        }
      }

      // Damage boss if active
      if (GekokujoSystem.boss) {
        GekokujoSystem.boss.hp -= damageAmount;
        EffectRenderer.add(GekokujoSystem.boss.x, GekokujoSystem.boss.y, "hit");
        if (GekokujoSystem.boss.hp <= 0) { GekokujoSystem.success(); }
      }

      // Flash + announcement
      this.flashTimer = 0.3;
      AnnouncementSystem.add("一揆!");
      this.cooldown = 20;
      ScoreManager.recalculate();
    }
  };

  // ============================================================
  // ShoninSystem (merchant economy)
  // ============================================================
  var ShoninSystem = {
    hireCooldown: 0,
    removeCooldown: 0,
    currentTerrainLabel: "",

    init: function() {
      this.hireCooldown = 0;
      this.removeCooldown = 0;
      this.currentTerrainLabel = "";
      gameState.koku = 0;
      gameState.kokuPerSecond = 0;
    },

    update: function(dt) {
      if (gameState.selectedChar !== "merchant") { return; }
      var terrain = TerrainManager.getTerrainAt(PlayerController.x, PlayerController.y);
      var incomeRate = 0;
      if (terrain === TERRAIN_TYPES.VILLAGE) {
        incomeRate = 2;
        this.currentTerrainLabel = "村 +2/s";
      } else if (terrain === TERRAIN_TYPES.CASTLE_TOWN) {
        incomeRate = 5;
        this.currentTerrainLabel = "城下町 +5/s";
      } else {
        incomeRate = 0;
        this.currentTerrainLabel = "";
      }
      gameState.kokuPerSecond = incomeRate;
      gameState.koku += incomeRate * dt;
      var upkeepCost = ParadeController.getLength() * 0.2 * dt;
      gameState.koku -= upkeepCost;
      if (this.removeCooldown > 0) { this.removeCooldown -= dt; }
      if (gameState.koku < 0) {
        gameState.koku = 0;
        if (this.removeCooldown <= 0 && ParadeController.getLength() > 0) {
          var lastIdx = ParadeController.members.length - 1;
          var removed = ParadeController.members[lastIdx];
          CivilianManager.civilians.push({
            x: removed.x, y: removed.y,
            wanderAngle: Math.random() * Math.PI * 2,
            wanderTimer: 0, recruitTimer: 0
          });
          ParadeController.members.splice(lastIdx, 1);
          ScoreManager.recalculate();
          AnnouncementSystem.add("石高不足! 傭兵が去った!");
          EffectRenderer.add(removed.x, removed.y, "surrender");
          this.removeCooldown = 1;
        }
      }
      if (this.hireCooldown > 0) { this.hireCooldown -= dt; }
      if (gameState.koku >= 10 && this.hireCooldown <= 0) {
        gameState.koku -= 10;
        ParadeController.addMember(PlayerController.x, PlayerController.y);
        AnnouncementSystem.add("傭兵を雇った! (石高 -10)");
        ScoreManager.recalculate();
        this.hireCooldown = 2;
      }
    },

    addKokuForKill: function(scoreValue) {
      var charType = gameState.selectedChar;
      if (charType === "ashigaru") {
        gameState.koku += 5;
      } else if (charType === "farmer") {
        gameState.koku += 2;
      } else if (charType === "merchant") {
        gameState.koku += 3;
      }
    }
  };

  // ============================================================
  // GekokujoSystem
  // ============================================================
  var GekokujoSystem = {
    available: true,
    gateActive: false,
    gatePos: null,
    boss: null,
    battleActive: false,
    battleTimer: 0,
    scheduleTime: 0,
    declineCooldown: 0,
    declinedGatePos: null,

    init: function() {
      this.available = true;
      this.gateActive = false;
      this.gatePos = null;
      this.boss = null;
      this.battleActive = false;
      this.battleTimer = 0;
      this.scheduleTime = 30 + Math.random() * 20;
      this.declineCooldown = 0;
      this.declinedGatePos = null;
    },

    update: function(dt) {
      // Show gate
      if (this.available && !this.gateActive && !this.battleActive && gameState.gameTime >= this.scheduleTime) {
        var castlePos = MapGenerator.getCastleWorldPos();
        this.gatePos = { x: castlePos.x, y: castlePos.y };
        this.gateActive = true;
        this.available = false;
        AnnouncementSystem.add("城門が出現した!");
      }

      // Decline cooldown: restore gate after 3 seconds
      if (this.declineCooldown > 0) {
        this.declineCooldown -= dt;
        if (this.declineCooldown <= 0) {
          this.declineCooldown = 0;
          if (this.declinedGatePos) {
            this.gatePos = this.declinedGatePos;
            this.gateActive = true;
            this.declinedGatePos = null;
          }
        }
      }

      // Gate approach
      if (this.gatePos && !this.battleActive && this.declineCooldown <= 0) {
        var dx = PlayerController.x - this.gatePos.x;
        var dy = PlayerController.y - this.gatePos.y;
        if (Math.sqrt(dx * dx + dy * dy) < 60) {
          this.gateActive = false;
          var savedGatePos = this.gatePos;
          this.gatePos = null;
          GameDirector.showDialog("城に攻め込む! 下克上を仕掛ける?", function(yes) {
            if (yes) {
              GekokujoSystem.startBattle();
            } else {
              GekokujoSystem.declineCooldown = 5;
              GekokujoSystem.declinedGatePos = savedGatePos;
              AnnouncementSystem.add("5秒後に再挑戦できます");
            }
          });
        }
      }

      // Boss battle
      if (this.battleActive) {
        this.battleTimer -= dt;
        var boss = this.boss;

        // Boss AI
        var bdx = PlayerController.x - boss.x;
        var bdy = PlayerController.y - boss.y;
        var bDist = Math.sqrt(bdx * bdx + bdy * bdy);
        if (bDist > 1) {
          boss.x += (bdx / bDist) * boss.speed;
          boss.y += (bdy / bDist) * boss.speed;
        }
        if (bDist < PlayerController.size + boss.size) {
          boss.attackTimer += dt;
          if (boss.attackTimer > 1.0) {
            boss.attackTimer = 0;
            var dead = PlayerController.takeDamage(boss.attack);
            if (dead) { this.fail(); return; }
          }
        }

        if (this.battleTimer <= 0) { this.fail(); }
      }
    },

    startBattle: function() {
      this.battleActive = true;
      this.battleTimer = 15;
      EnemyManager.enemies = [];
      var rIdx = Math.min(ScoreManager.rankIndex + 2, RANKS.length - 1);
      // Parade reduces boss HP
      var hpReduction = ParadeController.getLength() * 3;
      var bossHp = Math.max(30, 60 + rIdx * 40 - hpReduction);
      this.boss = {
        x: MapGenerator.getCastleWorldPos().x,
        y: MapGenerator.getCastleWorldPos().y,
        hp: bossHp, maxHp: bossHp,
        attack: 8 + rIdx * 4,
        speed: 2.5,
        size: 63,
        attackTimer: 0
      };
      AnnouncementSystem.add("下克上チャレンジ! 15秒で城主を倒せ!");
    },

    success: function() {
      this.battleActive = false;
      this.boss = null;
      ScoreManager.addRaw(200 + ScoreManager.rankIndex * 100);
      ScoreManager.rankIndex = Math.min(ScoreManager.rankIndex + 2, RANKS.length - 1);
      ScoreManager.recalculate();
      GameDirector.endGame(true);
    },

    fail: function() {
      this.battleActive = false;
      this.boss = null;
      gameState.phase = "result";
      skullScreen.classList.add("active");
    },

    draw: function(ctx) {
      // Gate
      if (this.gatePos) {
        var sp = CameraController.worldToScreen(this.gatePos.x, this.gatePos.y);
        if (spritesLoaded) {
          drawSpriteCentered(ctx, "castle", sp.x, sp.y, 80, false);
        } else {
          ctx.font = FONT.iconMedium;
          ctx.textAlign = "center";
          ctx.fillText("\uD83C\uDFEF", sp.x, sp.y + 10);
        }
        ctx.font = FONT.h5;
        ctx.textAlign = "center";
        ctx.fillStyle = "#1a1a1a";
        ctx.fillText("城門", sp.x, sp.y + 45);
        var pa = 0.3 + Math.sin(performance.now() / 300) * 0.2;
        ctx.strokeStyle = "rgba(0,0,0," + pa + ")";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 50, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Boss
      if (this.boss) {
        var bsp = CameraController.worldToScreen(this.boss.x, this.boss.y);
        if (spritesLoaded) {
          var bossFlipH = (this.boss.x < PlayerController.x);
          drawSpriteCentered(ctx, "tonosama", bsp.x, bsp.y, 140, bossFlipH);
        } else {
          ctx.font = FONT.iconLarge;
          ctx.textAlign = "center";
          ctx.fillText("\uD83C\uDFEF", bsp.x, bsp.y + 15);
        }
        ctx.fillStyle = "#ddd";
        ctx.fillRect(bsp.x - 30, bsp.y - 40, 60, 6);
        ctx.fillStyle = "#c44";
        ctx.fillRect(bsp.x - 30, bsp.y - 40, 60 * (this.boss.hp / this.boss.maxHp), 6);
        ctx.fillStyle = "#1a1a1a";
        ctx.font = FONT.h4;
        ctx.textAlign = "center";
        ctx.fillText("城主", bsp.x, bsp.y - 45);
      }
    }
  };

  // ============================================================

  var ScoreManager = {
    rawScore: 0,
    finalScore: 0,
    rankIndex: 0,

    init: function() {
      this.rawScore = 0;
      this.finalScore = 0;
      this.rankIndex = 0;
    },

    addRaw: function(amount) {
      this.rawScore += amount;
      this.recalculate();
      RankSystem.check();
    },

    recalculate: function() {
      var def = gameState.charDef;
      var followerMult = 1.0 + ParadeController.getLength() * def.followerBonus;
      var rankBonus = RANKS[this.rankIndex].bonus;
      this.finalScore = Math.floor(this.rawScore * followerMult * rankBonus);
    }
  };

  // ============================================================
  // RankSystem
  // ============================================================
  var RankSystem = {
    check: function() {
      for (var i = RANKS.length - 1; i >= 0; i--) {
        if (ScoreManager.rawScore >= RANKS[i].threshold) {
          if (i > ScoreManager.rankIndex) {
            ScoreManager.rankIndex = i;
            AnnouncementSystem.add("身分上昇! " + RANKS[i].name + "になった!");
            ScoreManager.recalculate();
          }
          break;
        }
      }
    },

    getCurrentName: function() {
      return RANKS[ScoreManager.rankIndex].name;
    }
  };

  // ============================================================
  // RankingManager
  // ============================================================
  var RankingManager = {
    save: function(score, charName) {
      var rankings = [];
      var stored = localStorage.getItem("gekokujo_final_rankings");
      if (stored) {
        try { rankings = JSON.parse(stored); } catch(e) { rankings = []; }
      }
      rankings.push({ score: score, character: charName, time: Date.now() });
      rankings.sort(function(a, b) { return b.score - a.score; });
      if (rankings.length > 100) { rankings = rankings.slice(0, 100); }
      localStorage.setItem("gekokujo_final_rankings", JSON.stringify(rankings));
      return rankings;
    },

    getRank: function(score) {
      var rankings = [];
      var stored = localStorage.getItem("gekokujo_final_rankings");
      if (stored) {
        try { rankings = JSON.parse(stored); } catch(e) { rankings = []; }
      }
      var rank = 1;
      for (var i = 0; i < rankings.length; i++) {
        if (rankings[i].score > score) { rank++; } else { break; }
      }
      return rank;
    }
  };

  // ============================================================
  // EffectRenderer
  // ============================================================
  var EffectRenderer = {
    effects: [],

    init: function() { this.effects = []; },

    add: function(x, y, type) {
      this.effects.push({ x: x, y: y, type: type, timer: 0, maxTime: 0.5 });
    },

    update: function(dt) {
      for (var i = this.effects.length - 1; i >= 0; i--) {
        this.effects[i].timer += dt;
        if (this.effects[i].timer >= this.effects[i].maxTime) {
          this.effects.splice(i, 1);
        }
      }
    },

    draw: function(ctx) {
      for (var i = 0; i < this.effects.length; i++) {
        var eff = this.effects[i];
        if (!CameraController.isVisible(eff.x, eff.y, 50)) { continue; }
        var sp = CameraController.worldToScreen(eff.x, eff.y);
        var alpha = 1.0 - (eff.timer / eff.maxTime);
        ctx.textAlign = "center";
        if (eff.type === "hit") {
          ctx.fillStyle = "rgba(0,0,0," + alpha + ")";
          ctx.font = FONT.effect;
          ctx.fillText("\uD83D\uDCA5", sp.x, sp.y - eff.timer * 30);
        } else if (eff.type === "destroy") {
          ctx.strokeStyle = "rgba(0,0,0," + alpha + ")";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, eff.timer * 40, 0, Math.PI * 2);
          ctx.stroke();
        } else if (eff.type === "recruit") {
          ctx.fillStyle = "rgba(0,0,0," + alpha + ")";
          ctx.font = FONT.h4;
          ctx.fillText("仲間!", sp.x, sp.y - eff.timer * 30);
        } else if (eff.type === "playerHit") {
          ctx.strokeStyle = "rgba(200,50,50," + alpha + ")";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, 25, 0, Math.PI * 2);
          ctx.stroke();
        } else if (eff.type === "surrender") {
          ctx.fillStyle = "rgba(0,0,0," + alpha + ")";
          ctx.font = FONT.h3;
          ctx.fillText("\uD83C\uDFF3\uFE0F", sp.x, sp.y - eff.timer * 20);
          ctx.font = FONT.h4;
          ctx.fillText("降伏!", sp.x, sp.y - eff.timer * 20 - 20);
        }
      }
    }
  };

  // ============================================================
  // BuildingRenderer
  // ============================================================
  var BuildingRenderer = {
    _seededRandom: function(seed) {
      var x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    },

    drawHouse: function(ctx, x, y, w, h) {
      // Walls
      ctx.fillStyle = "rgba(210,190,160,0.8)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "rgba(120,100,70,0.6)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x, y, w, h);
      // Roof (triangle)
      ctx.fillStyle = "rgba(100,70,40,0.7)";
      ctx.beginPath();
      ctx.moveTo(x - 4, y);
      ctx.lineTo(x + w / 2, y - h * 0.5);
      ctx.lineTo(x + w + 4, y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(80,50,30,0.5)";
      ctx.lineWidth = 1;
      ctx.stroke();
      // Door
      ctx.fillStyle = "rgba(80,60,40,0.6)";
      var doorW = w * 0.25;
      var doorH = h * 0.4;
      ctx.fillRect(x + w / 2 - doorW / 2, y + h - doorH, doorW, doorH);
    },

    drawTemple: function(ctx, x, y, w, h) {
      // Base
      ctx.fillStyle = "rgba(200,185,155,0.85)";
      ctx.fillRect(x, y + h * 0.3, w, h * 0.7);
      ctx.strokeStyle = "rgba(110,90,60,0.6)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x, y + h * 0.3, w, h * 0.7);
      // Multi-tier roof
      ctx.fillStyle = "rgba(90,65,35,0.75)";
      // Lower roof
      ctx.beginPath();
      ctx.moveTo(x - 6, y + h * 0.3);
      ctx.lineTo(x + w / 2, y + h * 0.1);
      ctx.lineTo(x + w + 6, y + h * 0.3);
      ctx.closePath();
      ctx.fill();
      // Upper roof
      ctx.beginPath();
      ctx.moveTo(x + w * 0.15, y + h * 0.1);
      ctx.lineTo(x + w / 2, y - h * 0.15);
      ctx.lineTo(x + w * 0.85, y + h * 0.1);
      ctx.closePath();
      ctx.fill();
      // Pillar
      ctx.fillStyle = "rgba(150,50,40,0.5)";
      ctx.fillRect(x + w * 0.15, y + h * 0.3, w * 0.08, h * 0.7);
      ctx.fillRect(x + w * 0.77, y + h * 0.3, w * 0.08, h * 0.7);
    },

    drawCastleKeep: function(ctx, x, y, w, h) {
      // Multi-story castle keep
      var storyH = h / 3;
      // Base story
      ctx.fillStyle = "rgba(230,220,200,0.9)";
      ctx.fillRect(x, y + storyH * 2, w, storyH);
      ctx.strokeStyle = "rgba(50,50,50,0.2)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y + storyH * 2, w, storyH);
      // Second story (narrower)
      var s2w = w * 0.8;
      ctx.fillRect(x + (w - s2w) / 2, y + storyH, s2w, storyH);
      ctx.strokeRect(x + (w - s2w) / 2, y + storyH, s2w, storyH);
      // Top story with roof
      var s3w = w * 0.6;
      ctx.fillRect(x + (w - s3w) / 2, y + storyH * 0.4, s3w, storyH * 0.6);
      ctx.strokeRect(x + (w - s3w) / 2, y + storyH * 0.4, s3w, storyH * 0.6);
      // Roof
      ctx.fillStyle = "rgba(60,50,30,0.7)";
      ctx.beginPath();
      ctx.moveTo(x + (w - s3w) / 2 - 5, y + storyH * 0.4);
      ctx.lineTo(x + w / 2, y - storyH * 0.2);
      ctx.lineTo(x + (w + s3w) / 2 + 5, y + storyH * 0.4);
      ctx.closePath();
      ctx.fill();
    },

    drawCastle: function(ctx, bx, by, bw, bh) {
      // Large castle keep in center
      this.drawCastleKeep(ctx, bx + bw / 2 - 50, by + bh / 2 - 60, 100, 100);
      // Walls around
      ctx.strokeStyle = "rgba(140,120,90,0.4)";
      ctx.lineWidth = 3;
      ctx.strokeRect(bx + bw * 0.15, by + bh * 0.15, bw * 0.7, bh * 0.7);
      // Corner towers
      var towers = [
        [bx + bw * 0.15, by + bh * 0.15],
        [bx + bw * 0.85 - 25, by + bh * 0.15],
        [bx + bw * 0.15, by + bh * 0.85 - 25],
        [bx + bw * 0.85 - 25, by + bh * 0.85 - 25]
      ];
      for (var ti = 0; ti < towers.length; ti++) {
        this.drawHouse(ctx, towers[ti][0], towers[ti][1], 25, 22);
      }
      // Label
      ctx.font = FONT.h4;
      ctx.textAlign = "center";
      ctx.fillStyle = "#1a1a1a";
      ctx.fillText("城", bx + bw / 2, by + bh / 2 + 70);
    },

    drawCastleTown: function(ctx, bx, by, bw, bh, seed) {
      // Many buildings in a grid pattern
      var cols = 5;
      var rows = 4;
      var margin = 40;
      var spacingX = (bw - margin * 2) / cols;
      var spacingY = (bh - margin * 2) / rows;
      var buildingCount = 0;
      for (var row = 0; row < rows; row++) {
        for (var col = 0; col < cols; col++) {
          var s = this._seededRandom(seed * 100 + row * 10 + col);
          if (s < 0.2) { continue; } // some gaps for roads
          var hx = bx + margin + col * spacingX + spacingX * 0.1;
          var hy = by + margin + row * spacingY + spacingY * 0.15;
          var hw = spacingX * 0.7;
          var hh = spacingY * 0.55;
          if (s > 0.8) {
            this.drawTemple(ctx, hx, hy, hw, hh);
          } else {
            this.drawHouse(ctx, hx, hy, hw, hh);
          }
          buildingCount++;
        }
      }
      ctx.font = FONT.h4;
      ctx.textAlign = "center";
      ctx.fillStyle = "#1a1a1a";
      ctx.fillText("城下町", bx + bw / 2, by + bh - 15);
    },

    drawVillage: function(ctx, bx, by, bw, bh, seed) {
      // Scattered houses
      var count = 8;
      for (var vi = 0; vi < count; vi++) {
        var s1 = this._seededRandom(seed * 50 + vi * 7 + 1);
        var s2 = this._seededRandom(seed * 50 + vi * 7 + 2);
        var hx = bx + 60 + s1 * (bw - 140);
        var hy = by + 60 + s2 * (bh - 140);
        var hw = 35 + this._seededRandom(seed * 50 + vi * 7 + 3) * 20;
        var hh = 28 + this._seededRandom(seed * 50 + vi * 7 + 4) * 15;
        this.drawHouse(ctx, hx, hy, hw, hh);
      }
      ctx.font = FONT.h4;
      ctx.textAlign = "center";
      ctx.fillStyle = "#1a1a1a";
      ctx.fillText("村", bx + bw / 2, by + bh - 15);
    }
  };

  // ============================================================
  // HouseManager - deterministic house placement for terrain blocks
  // ============================================================
  var HouseManager = {
    _cache: {},

    clear: function() {
      this._cache = {};
    },

    getHouses: function(row, col) {
      var key = row + "_" + col;
      if (this._cache[key]) {
        return this._cache[key];
      }
      var houses = this._generate(row, col);
      this._cache[key] = houses;
      return houses;
    },

    _generate: function(row, col) {
      var houses = [];
      // Use deterministic seed based on row/col
      var seed = (row * 7919 + col * 6271) & 0x7fffffff;
      var bl = null;
      for (var i = 0; i < TerrainManager.blocks.length; i++) {
        var b = TerrainManager.blocks[i];
        if (b.row === row && b.col === col) {
          bl = b;
          break;
        }
      }
      if (!bl) { return houses; }

      var count = 8;
      if (bl.type === TERRAIN_TYPES.CASTLE_TOWN) {
        count = 12;
      }

      for (var h = 0; h < count; h++) {
        seed = ((seed * 1103515245 + 12345) & 0x7fffffff);
        var hx = 100 + (seed % (BLOCK_W - 200));
        seed = ((seed * 1103515245 + 12345) & 0x7fffffff);
        var hy = 100 + (seed % (BLOCK_H - 200));
        houses.push({ x: hx, y: hy, collisionRadius: 35 });
      }
      return houses;
    }
  };

  // ============================================================
  // GameDirector
  // ============================================================
  var GameDirector = {
    countdownTimer: 0,
    countdownText: "",

    init: function() {
      var self = this;
      if (tilesheetLoaded && spritesLoaded) {
        self._initSystems();
        return;
      }
      // Show loading state
      gameState.phase = "loading";
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = "#1a1a1a";
      ctx.font = FONT.h3;
      ctx.textAlign = "center";
      ctx.fillText("読み込み中...", CANVAS_W / 2, CANVAS_H / 2);

      var tilesheetDone = tilesheetLoaded;
      var spritesDone = spritesLoaded;

      function checkAllLoaded() {
        if (tilesheetDone && spritesDone) {
          self._initSystems();
        }
      }

      if (!tilesheetLoaded) {
        tilesheetImg.onload = function() {
          tilesheetLoaded = true;
          tilesheetDone = true;
          checkAllLoaded();
        };
        tilesheetImg.src = "../docs/findings/sozai/kenney_roguelike-rpg-pack/Spritesheet/roguelikeSheet_transparent.png";
      }

      if (!spritesLoaded) {
        loadAllSprites(function() {
          spritesDone = true;
          checkAllLoaded();
        });
      }
    },

    _initSystems: function() {
      gameState.gameTime = 0;
      gameState.paused = false;
      gameState.phase = "countdown";

      // Generate map
      MapGenerator.generate();

      // Init all systems
      var startPos = MapGenerator.getPlayerStartPos();
      PlayerController.init(startPos);
      CameraController.x = startPos.x - CANVAS_W / 2;
      CameraController.y = startPos.y - CANVAS_H / 2;

      EnemyManager.init();
      CivilianManager.init();
      ParadeController.init();
      ProjectileManager.init();
      EffectRenderer.init();
      AnnouncementSystem.init();
      ScoreManager.init();
      TsujigiriSystem.init();
      IkkiSystem.init();
      ShoninSystem.init();
      GekokujoSystem.init();

      // Initial spawns
      for (var i = 0; i < 5; i++) { EnemyManager.spawn(); }
      for (var j = 0; j < 15; j++) { CivilianManager.spawn(); }

      // Start countdown
      this.countdownTimer = 3.5;
      this.countdownText = "3";

      gameState.lastTimestamp = performance.now();
      requestAnimationFrame(this.countdownLoop.bind(this));
    },

    countdownLoop: function(timestamp) {
      if (gameState.phase !== "countdown") { return; }
      var dt = (timestamp - gameState.lastTimestamp) / 1000;
      gameState.lastTimestamp = timestamp;
      if (dt > 0.1) { dt = 0.1; }

      this.countdownTimer -= dt;

      if (this.countdownTimer > 2.5) {
        this.countdownText = "3";
      } else if (this.countdownTimer > 1.5) {
        this.countdownText = "2";
      } else if (this.countdownTimer > 0.5) {
        this.countdownText = "1";
      } else if (this.countdownTimer > 0) {
        this.countdownText = "始め!";
      } else {
        gameState.phase = "playing";
        gameState.lastTimestamp = performance.now();
        requestAnimationFrame(this.gameLoop.bind(this));
        return;
      }

      // Render scene (frozen) + countdown overlay
      this.render();

      // Draw countdown text on top
      ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.font = "bold 120px 'Chika', 'MokoMori', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#1a1a1a";
      ctx.fillText(this.countdownText, CANVAS_W / 2, CANVAS_H / 2);
      ctx.textBaseline = "alphabetic";

      requestAnimationFrame(this.countdownLoop.bind(this));
    },

    showDialog: function(text, callback) {
      dialogTextEl.textContent = text;
      dialogCallback = callback;
      dialogOverlay.classList.add("active");
      gameState.paused = true;
    },

    gameLoop: function(timestamp) {
      if (gameState.phase !== "playing") { return; }
      var dt = (timestamp - gameState.lastTimestamp) / 1000;
      gameState.lastTimestamp = timestamp;
      if (dt > 0.1) { dt = 0.1; }

      if (!gameState.paused) {
        this.update(dt);
      } else {
        // Tsujigiri QTE updates even during pause
        if (TsujigiriSystem.phase !== "idle") {
          TsujigiriSystem.update(dt);
        }
      }
      this.render();
      requestAnimationFrame(this.gameLoop.bind(this));
    },

    update: function(dt) {
      gameState.gameTime += dt;
      InputManager.updateWorldMouse();

      // Time up
      var remaining = MAX_TIME - gameState.gameTime;
      if (remaining <= 0 && !GekokujoSystem.battleActive) {
        this.endGame(false);
        return;
      }

      // Handle input
      if (InputManager.consumeLeftClick()) {
        CombatSystem.handleAttack();
      }
      if (InputManager.consumeRightClick()) {
        ParadeChargeSystem.start();
      }
      if (InputManager.consumeQ()) { IkkiSystem.tryActivate(); }

      // Update all systems
      PlayerController.update(dt);
      CameraController.follow(PlayerController.x, PlayerController.y);
      EnemyManager.update(dt);
      CivilianManager.update(dt);
      if (!ParadeChargeSystem.active) {
        ParadeController.update(dt);
      }
      ParadeChargeSystem.update(dt);
      IntimidationSystem.update(dt);
      ProjectileManager.update(dt);
      TsujigiriSystem.update(dt);
      IkkiSystem.update(dt);
      ShoninSystem.update(dt);
      GekokujoSystem.update(dt);
      EffectRenderer.update(dt);
      AnnouncementSystem.update(dt);
    },

    render: function() {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

      // Background (solid fill prevents tile gap artifacts)
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // Washi texture
      ctx.fillStyle = "rgba(200,200,200,0.2)";
      var startX = -(CameraController.x % 20);
      var startY = -(CameraController.y % 20);
      for (var wx = startX; wx < CANVAS_W; wx += 20) {
        for (var wy = startY; wy < CANVAS_H; wy += 20) {
          var worldWx = wx + CameraController.x;
          var worldWy = wy + CameraController.y;
          if (Math.sin(worldWx * 0.7 + worldWy * 1.3) > 0.5) {
            ctx.fillRect(wx, wy, 2, 2);
          }
        }
      }

      // Draw terrain blocks
      for (var bi = 0; bi < TerrainManager.blocks.length; bi++) {
        var bl = TerrainManager.blocks[bi];
        var bsp = CameraController.worldToScreen(bl.x, bl.y);
        // Only draw if visible
        if (bsp.x + bl.w < -50 || bsp.x > CANVAS_W + 50 || bsp.y + bl.h < -50 || bsp.y > CANVAS_H + 50) { continue; }

        if (tilesheetLoaded) {
          var blockCanvas = TerrainTileCache.buildBlockCanvas(bl.type, bl.row, bl.col);
          ctx.drawImage(blockCanvas, bsp.x, bsp.y);
        }

        if (bl.type === TERRAIN_TYPES.CASTLE) {
          // Castle sprite
          if (spritesLoaded) {
            drawSpriteCentered(ctx, "castle", bsp.x + bl.w / 2, bsp.y + bl.h / 2, 120, false);
          }
          ctx.fillStyle = "#1a1a1a";
          ctx.textAlign = "center";
          ctx.font = FONT.h4;
          ctx.fillText("城", bsp.x + bl.w / 2, bsp.y + bl.h / 2 + 70);
        } else if (bl.type === TERRAIN_TYPES.CASTLE_TOWN) {
          // Castle town sprites
          if (spritesLoaded) {
            var ctHouses = HouseManager.getHouses(bl.row, bl.col);
            for (var cthi = 0; cthi < ctHouses.length; cthi++) {
              var cth = ctHouses[cthi];
              drawSpriteCentered(ctx, "house_town", bsp.x + cth.x, bsp.y + cth.y, 50, false);
            }
          }
        } else if (bl.type === TERRAIN_TYPES.MOUNTAIN) {
          ctx.font = FONT.h3;
          ctx.textAlign = "center";
          ctx.fillStyle = "#1a1a1a";
          ctx.fillText("\u26F0\uFE0F", bsp.x + bl.w / 2, bsp.y + bl.h / 2 + 8);
          ctx.font = FONT.h4;
          ctx.fillText("山道", bsp.x + bl.w / 2, bsp.y + bl.h / 2 + 28);
        } else if (bl.type === TERRAIN_TYPES.VILLAGE) {
          // Village sprites
          if (spritesLoaded) {
            var vHouses = HouseManager.getHouses(bl.row, bl.col);
            for (var vhi = 0; vhi < vHouses.length; vhi++) {
              var vhItem = vHouses[vhi];
              drawSpriteCentered(ctx, "house_villege", bsp.x + vhItem.x, bsp.y + vhItem.y, 45, false);
            }
          }
        }

        // Block border (subtle grid)
        ctx.strokeStyle = "rgba(220,220,220,0.15)";
        ctx.lineWidth = 1;
        ctx.strokeRect(bsp.x, bsp.y, bl.w, bl.h);
      }

      // River (vertical)
      var riverSp = CameraController.worldToScreen(TerrainManager.riverX, 0);
      if (riverSp.x + TerrainManager.riverW > 0 && riverSp.x < CANVAS_W) {
        if (tilesheetLoaded) {
          var riverCanvas = TerrainTileCache.buildRiverCanvas(TerrainManager.riverX, TerrainManager.riverW);
          var srcY = CameraController.y;
          if (srcY < 0) { srcY = 0; }
          var drawY = -CameraController.y;
          if (drawY < 0) { drawY = 0; }
          ctx.drawImage(
            riverCanvas,
            0, srcY, riverCanvas.width, CANVAS_H,
            riverSp.x - RENDER_TILE_SIZE, drawY, riverCanvas.width, CANVAS_H
          );
        }
      }

      // Bridges
      for (var bri = 0; bri < TerrainManager.bridges.length; bri++) {
        var br = TerrainManager.bridges[bri];
        var brSp = CameraController.worldToScreen(br.x, br.y);
        if (brSp.x + br.w < 0 || brSp.x > CANVAS_W || brSp.y + br.h < 0 || brSp.y > CANVAS_H) { continue; }
        if (tilesheetLoaded) {
          var bridgeCanvas = TerrainTileCache.buildBridgeCanvas(br.w, br.h, bri);
          ctx.drawImage(bridgeCanvas, brSp.x, brSp.y);
        }
        ctx.font = FONT.h5;
        ctx.textAlign = "center";
        ctx.fillStyle = "#1a1a1a";
        if (br.safe) {
          ctx.fillText("大橋", brSp.x + br.w / 2, brSp.y + br.h / 2 + 3);
        } else {
          ctx.fillText("小橋", brSp.x + br.w / 2, brSp.y + br.h / 2 + 3);
        }
      }

      // Game entities
      CivilianManager.draw(ctx);
      ParadeController.draw(ctx);
      EnemyManager.draw(ctx);
      PlayerController.draw(ctx);
      ProjectileManager.draw(ctx);
      TsujigiriSystem.draw(ctx);
      GekokujoSystem.draw(ctx);
      EffectRenderer.draw(ctx);

      // === HUD (screen space) ===
      ctx.textAlign = "left";
      var remaining = Math.max(0, Math.ceil(MAX_TIME - gameState.gameTime));
      if (GekokujoSystem.battleActive) { remaining = Math.max(0, Math.ceil(GekokujoSystem.battleTimer)); }
      if (remaining <= 10) { ctx.fillStyle = "#c03030"; }
      else { ctx.fillStyle = "#1a1a1a"; }
      ctx.font = FONT.h2;
      ctx.fillText("残り " + remaining + "秒", 20, 35);

      if (GekokujoSystem.battleActive) {
        ctx.fillStyle = "#1a1a1a";
        ctx.font = FONT.h3;
        ctx.fillText("下克上チャレンジ!", 20, 58);
      }

      ctx.fillStyle = "#1a1a1a";
      ctx.font = FONT.h3;
      ctx.textAlign = "right";
      ctx.fillText("石高: " + ScoreManager.finalScore, MINIMAP_X - 10, 30);
      ctx.fillStyle = "#2a2a2a";
      ctx.font = FONT.h4;
      ctx.fillText("身分: " + RankSystem.getCurrentName(), MINIMAP_X - 10, 52);
      ctx.fillText("民衆: " + ParadeController.getLength() + "人", MINIMAP_X - 10, 72);
      ctx.fillText(gameState.charDef.name + " " + gameState.charDef.emoji, MINIMAP_X - 10, 92);

      // Charge indicator
      ctx.textAlign = "left";
      if (PlayerController.chargeCooldown > 0) {
        ctx.fillStyle = "#aaa";
        ctx.font = FONT.h5;
        ctx.fillText("突撃 [右クリック] " + Math.ceil(PlayerController.chargeCooldown) + "秒", 20, CANVAS_H - 30);
      } else {
        ctx.fillStyle = "#1a1a1a";
        ctx.font = FONT.h5;
        ctx.fillText("突撃 [右クリック] 準備完了", 20, CANVAS_H - 30);
      }

      // Ikki flash effect
      if (IkkiSystem.flashTimer > 0) {
        var flashAlpha = IkkiSystem.flashTimer / 0.3;
        ctx.fillStyle = "rgba(255,255,255," + (flashAlpha * 0.7) + ")";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }

      // Ikki HUD (farmer only)
      if (IkkiSystem.available) {
        ctx.textAlign = "left";
        if (IkkiSystem.cooldown > 0) {
          ctx.fillStyle = "#aaa";
          ctx.font = FONT.h5;
          ctx.fillText("一揆 [Q] " + Math.ceil(IkkiSystem.cooldown) + "秒", 20, CANVAS_H - 45);
        } else if (ParadeController.getLength() < 1) {
          ctx.fillStyle = "#aaa";
          ctx.font = FONT.h5;
          ctx.fillText("一揆 [Q] 仲間1人必要", 20, CANVAS_H - 45);
        } else {
          ctx.fillStyle = "#c03030";
          ctx.font = FONT.h5;
          ctx.fillText("一揆 [Q] 準備完了!", 20, CANVAS_H - 45);
        }
      }

      // Merchant koku display
      if (gameState.selectedChar === "merchant") {
        ctx.fillStyle = "#d4a030";
        ctx.font = FONT.h5;
        ctx.textAlign = "left";
        var kokuText = "石高: " + Math.floor(gameState.koku);
        if (ShoninSystem.currentTerrainLabel) {
          kokuText += " (" + ShoninSystem.currentTerrainLabel + ")";
        }
        ctx.fillText(kokuText, 20, CANVAS_H - 60);
      }

      // Castle direction arrow
      if (!GekokujoSystem.battleActive) {
        var castlePos = MapGenerator.getCastleWorldPos();
        var cdx = castlePos.x - PlayerController.x;
        var cdy = castlePos.y - PlayerController.y;
        var cDist = Math.sqrt(cdx * cdx + cdy * cdy);
        if (cDist > 300) {
          var cAngle = Math.atan2(cdy, cdx);
          var arrowX = CANVAS_W / 2 + Math.cos(cAngle) * 250;
          var arrowY = CANVAS_H / 2 + Math.sin(cAngle) * 200;
          // Clamp to screen
          if (arrowX < 30) { arrowX = 30; }
          if (arrowX > CANVAS_W - 30) { arrowX = CANVAS_W - 30; }
          if (arrowY < 30) { arrowY = 30; }
          if (arrowY > CANVAS_H - 50) { arrowY = CANVAS_H - 50; }
          ctx.save();
          ctx.translate(arrowX, arrowY);
          ctx.rotate(cAngle);
          ctx.fillStyle = "rgba(200, 60, 60, 0.4)";
          ctx.beginPath();
          ctx.moveTo(15, 0);
          ctx.lineTo(-8, -8);
          ctx.lineTo(-8, 8);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
          ctx.fillStyle = "rgba(200, 60, 60, 0.4)";
          ctx.font = FONT.h5;
          ctx.textAlign = "center";
          ctx.fillText("城", arrowX, arrowY + 18);
        }
      }

      // Controls hint
      if (gameState.gameTime < 5) {
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.font = FONT.h4;
        ctx.textAlign = "center";
        var controlsText = "WASD:移動  左クリック:攻撃  右クリック:行列突撃  SPACE:辻斬り返し";
        if (gameState.selectedChar === "farmer") {
          controlsText += "  Q:一揆";
        }
        ctx.fillText(controlsText, CANVAS_W / 2, CANVAS_H - 55);
      }

      // Announcements
      AnnouncementSystem.draw(ctx);

      // Minimap (always on top)
      MinimapRenderer.draw(ctx);
    },

    endGame: function(gekokujoWin) {
      gameState.phase = "result";
      ScoreManager.recalculate();
      if (gekokujoWin) {
        ResultRenderer.showGekokujoSuccess();
      } else if (PlayerController.hp <= 0) {
        // Player died - show skull screen with 下克上失敗
        skullScreen.classList.add("active");
      } else {
        ResultRenderer.showNormal();
      }
    }
  };

  // ============================================================
  // Scene Management (UI event wiring)
  // ============================================================
  document.getElementById("startBtn").addEventListener("click", function() {
    titleScreen.classList.remove("active");
    charSelect.classList.add("active");
    gameState.phase = "charSelect";
  });

  var charCards = document.querySelectorAll(".char-card");
  for (var i = 0; i < charCards.length; i++) {
    charCards[i].addEventListener("click", function() {
      var charKey = this.getAttribute("data-char");
      gameState.selectedChar = charKey;
      gameState.charDef = CHAR_DEFS[charKey];
      charSelect.classList.remove("active");
      GameDirector.init();
    });
  }

  document.getElementById("replayBtn").addEventListener("click", function() {
    resultScreen.classList.remove("active");
    titleScreen.classList.add("active");
    gameState.phase = "title";
  });

  document.getElementById("skullReplayBtn").addEventListener("click", function() {
    skullScreen.classList.remove("active");
    titleScreen.classList.add("active");
    gameState.phase = "title";
  });

  dialogYesBtn.addEventListener("click", function() {
    dialogOverlay.classList.remove("active");
    gameState.paused = false;
    if (dialogCallback) { dialogCallback(true); dialogCallback = null; }
  });

  dialogNoBtn.addEventListener("click", function() {
    dialogOverlay.classList.remove("active");
    gameState.paused = false;
    if (dialogCallback) { dialogCallback(false); dialogCallback = null; }
  });

  // Init input
  InputManager.init();

})();
</script>
