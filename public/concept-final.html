<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>下克上オンライン - 案1+5合体版</title>
<style>
@font-face {
  font-family: 'Chika';
  src: url('sprites/chika-Regular.ttf') format('truetype');
}
@font-face {
  font-family: 'MokoMori';
  src: url('sprites/mikiyu-newpenji-p.ttf') format('truetype');
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #fafafa;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Chika', 'MokoMori', sans-serif;
  color: #1a1a1a;
  overflow: hidden;
}
#game-container { position: relative; width: 800px; height: 600px; }
canvas { display: block; border: 3px solid #1a1a1a; cursor: crosshair; }
.screen-overlay {
  position: absolute; top: 0; left: 0; width: 800px; height: 600px;
  display: none; flex-direction: column; justify-content: center; align-items: center;
  background: rgba(255, 255, 255, 0.97); z-index: 10;
}
.screen-overlay.active { display: flex; }
#title-screen { text-align: center; }
.title-image-wrapper {
  width: 500px; margin: 0 auto 20px auto;
}
.title-image-wrapper img {
  display: block; width: 100%;
}
.btn {
  background: #fff;
  color: #1a1a1a; border: 3px solid #1a1a1a; padding: 14px 48px;
  border-radius: 40px;
  font-size: 30px; font-family: inherit; cursor: pointer; letter-spacing: 4px; transition: all 0.2s;
}
.btn:hover { background: #f0f0f0; transform: scale(1.05); }
.btn:active { transform: scale(0.98); }
#char-select { text-align: center; }
#char-select h2 { font-size: 38px; color: #1a1a1a; margin-bottom: 30px; letter-spacing: 4px; }
.char-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; padding: 0 10px; }
.char-card {
  background: rgba(255, 255, 255, 0.9); border: 2px solid #ddd; padding: 16px;
  cursor: pointer; transition: all 0.2s; text-align: left;
}
.char-card:hover { border-color: #1a1a1a; background: rgba(255, 255, 255, 1); transform: translateY(-2px); }
.char-img { display: block; height: 90px; margin: 0 auto 4px auto; image-rendering: pixelated; }
.char-card .char-name { font-size: 26px; font-weight: bold; color: #1a1a1a; margin-bottom: 4px; }
.char-card .char-type { font-size: 16px; color: #666; margin-bottom: 8px; }
.char-card .char-desc { font-size: 16px; color: #2a2a2a; line-height: 1.6; }
.char-stats { margin-top: 8px; }
.stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.stat-label { font-size: 16px; color: #666; }
.stat-value { font-size: 18px; letter-spacing: 2px; }
#result-screen { text-align: center; }
#result-screen .result-score { font-size: 32px; color: #1a1a1a; margin-bottom: 6px; margin-top: 16px; }
#result-screen .result-rank { margin-bottom: 30px; display: inline-block; text-align: left; }
#result-screen .rank-label { font-size: 30px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
#result-screen .rank-number { font-size: 80px; font-weight: 900; color: #ffe033; -webkit-text-stroke: 4px #1a1a1a; text-stroke: 4px #1a1a1a; letter-spacing: 4px; }
#result-screen h2 { font-size: 48px; margin-bottom: 20px; letter-spacing: 4px; }
#result-screen .result-details { font-size: 22px; color: #2a2a2a; margin-bottom: 30px; line-height: 1.8; white-space: pre-line; }
.dialog-overlay {
  position: absolute; top: 0; left: 0; width: 800px; height: 600px;
  display: none; justify-content: center; align-items: center;
  background: rgba(0, 0, 0, 0.4); z-index: 20;
}
.dialog-overlay.active { display: flex; }
.dialog-box { background: #fff; border: 3px solid #1a1a1a; padding: 30px 40px; text-align: center; max-width: 400px; }
.dialog-box p { font-size: 26px; margin-bottom: 20px; line-height: 1.6; color: #1a1a1a; }
.dialog-buttons { display: flex; gap: 16px; justify-content: center; }
.dialog-btn {
  background: #fff;
  color: #1a1a1a; border: 2px solid #1a1a1a; padding: 10px 30px;
  font-size: 24px; font-family: inherit; cursor: pointer; letter-spacing: 2px;
}
.dialog-btn:hover { background: #eee; }
.dialog-btn.yes { border-color: #1a1a1a; color: #1a1a1a; font-weight: bold; }
.dialog-btn.no { border-color: #999; color: #666; }
#skull-screen { background: rgba(10, 10, 10, 0.97); }
#skull-screen .skull-emoji { font-size: 100px; margin-bottom: 20px; }
#skull-screen h2 { font-size: 48px; color: #c04040; margin-bottom: 30px; letter-spacing: 6px; }
.success-banner { color: #1a1a1a; text-shadow: 0 0 10px rgba(0,0,0,0.2); }
.concentration-lines {
  position: absolute; top: 0; left: 0; width: 800px; height: 600px;
  pointer-events: none; z-index: 11; display: none;
}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="title-screen" class="screen-overlay active">
    <div class="title-image-wrapper">
      <img src="../docs/findings/sozai/title3.jpg" alt="下克上オンライン">
    </div>
    <button class="btn" id="startBtn">START</button>
  </div>
  <div id="char-select" class="screen-overlay">
    <h2>身分を選べ</h2>
    <div class="char-grid">
      <div class="char-card" data-char="farmer">
        <img src="sprites/nomin_play.png" class="char-img" alt="農民">
        <div class="char-name">農民（ひゃくしょう）</div>
        <div class="char-type">テクニカル / 玄人向け</div>
        <div class="char-desc">最弱だが「一揆」で大逆転。民衆を集めるほど全ステ強化</div>
        <div class="char-stats">
          <div class="stat-row">
            <span class="stat-label">攻撃</span>
            <span class="stat-value">&#x2605;&#x2606;&#x2606;&#x2606;&#x2606;</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">速度</span>
            <span class="stat-value">&#x2605;&#x2605;&#x2606;&#x2606;&#x2606;</span>
          </div>
        </div>
      </div>
      <div class="char-card" data-char="ashigaru">
        <img src="sprites/ashigaru_play.png" class="char-img" alt="足軽">
        <div class="char-name">足軽（あしがる）</div>
        <div class="char-type">バランス型 / 入門向け</div>
        <div class="char-desc">前方扇状の広い攻撃。行列突撃後の再集結が速い</div>
        <div class="char-stats">
          <div class="stat-row">
            <span class="stat-label">攻撃</span>
            <span class="stat-value">&#x2605;&#x2605;&#x2605;&#x2606;&#x2606;</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">速度</span>
            <span class="stat-value">&#x2605;&#x2605;&#x2605;&#x2606;&#x2606;</span>
          </div>
        </div>
      </div>
      <div class="char-card" data-char="merchant">
        <img src="sprites/shonin_play.png" class="char-img" alt="商人">
        <div class="char-name">商人（あきんど）</div>
        <div class="char-type">経済型 / 戦略向け</div>
        <div class="char-desc">金で仲間を即リクルート。地形収入と維持費の経営バランスが鍵</div>
        <div class="char-stats">
          <div class="stat-row">
            <span class="stat-label">攻撃</span>
            <span class="stat-value">&#x2605;&#x2606;&#x2606;&#x2606;&#x2606;</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">速度</span>
            <span class="stat-value">&#x2605;&#x2605;&#x2605;&#x2606;&#x2606;</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="result-screen" class="screen-overlay">
    <h2 id="resultTitle"></h2>
    <div class="result-rank">
      <div class="rank-label" id="rankLabel"></div>
      <div class="rank-number" id="rankNumber"></div>
    </div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-details" id="resultDetails"></div>
    <button class="btn" id="replayBtn">もう一度</button>
  </div>
  <div id="skull-screen" class="screen-overlay">
    <div class="skull-emoji">&#x1F480;</div>
    <h2>下克上失敗.....</h2>
    <button class="btn" id="skullReplayBtn">もう一度</button>
  </div>
  <div id="dialog-overlay" class="dialog-overlay">
    <div class="dialog-box">
      <p id="dialogText"></p>
      <div class="dialog-buttons">
        <button class="dialog-btn yes" id="dialogYes">はい</button>
        <button class="dialog-btn no" id="dialogNo">いいえ</button>
      </div>
    </div>
  </div>
  <canvas id="linesCanvas" class="concentration-lines" width="800" height="600"></canvas>
</div>
<script>
(function() {
  "use strict";

  // ============================================================
  // Constants
  // ============================================================
  var CANVAS_W = 800;
  var CANVAS_H = 600;
  var MAP_W = 2400;
  var MAP_H = 1800;
  var BLOCK_W = 800;
  var BLOCK_H = 600;
  var HISTORY_SPACING = 8;
  var MAX_TIME = 90;
  var MINIMAP_W = 128;
  var MINIMAP_H = 96;
  var MINIMAP_X = CANVAS_W - MINIMAP_W - 10;
  var MINIMAP_Y = 10;

  var CHAR_DEFS = {
    ashigaru: {
      name: "足軽", emoji: "\u2694\uFE0F", attack: 6, speed: 3.5,
      recruitRange: 55, recruitTime: 200, followerBonus: 0.008,
      regroupSpeed: 0.85, chargeMultiplier: 1.0,
    },
    merchant: {
      name: "商人", emoji: "\uD83D\uDCB0", attack: 2, speed: 3.2,
      recruitRange: 55, recruitTime: 0, followerBonus: 0.007,
      regroupSpeed: 0.7, chargeMultiplier: 0.5,
      initialKoku: 1000, recruitCost: 5
    },
    farmer: {
      name: "農民", emoji: "\uD83D\uDC68\u200D\uD83C\uDF3E", attack: 3, speed: 2.8,
      recruitRange: 65, recruitTime: 600, followerBonus: 0.025,
      regroupSpeed: 1.0, chargeMultiplier: 0.8,
    }
  };

  var RANKS = [
    { name: "農民", threshold: 0, bonus: 1.0 },
    { name: "足軽", threshold: 50, bonus: 1.2 },
    { name: "侍", threshold: 150, bonus: 1.5 },
    { name: "武将", threshold: 350, bonus: 2.0 },
    { name: "大名", threshold: 700, bonus: 2.5 },
    { name: "天下人", threshold: 1200, bonus: 3.0 }
  ];

  var ENEMY_DEFS = [
    { name: "野盗", emoji: "\uD83D\uDC79", hp: 20, attack: 3, speed: 1.5, score: 10, size: 25, grit: 3 },
    { name: "足軽隊", emoji: "\uD83D\uDD34", hp: 35, attack: 5, speed: 1.8, score: 25, size: 29, grit: 10 },
    { name: "侍", emoji: "\u26E9\uFE0F", hp: 55, attack: 8, speed: 2.0, score: 50, size: 32, grit: 999 },
    { name: "武将", emoji: "\uD83C\uDFF4", hp: 80, attack: 12, speed: 2.2, score: 80, size: 40, grit: 999 }
  ];

  var TERRAIN_TYPES = {
    CASTLE: "castle",
    RIVER: "river",
    BRIDGE: "bridge",
    GRASSLAND: "grassland",
    CASTLE_TOWN: "castleTown",
    MOUNTAIN: "mountain",
    VILLAGE: "village",
    EMPTY: "empty"
  };

  // ============================================================
  // Tilesheet Constants
  // ============================================================
  var TILE_SIZE = 16;
  var TILE_MARGIN = 1;
  var TILE_STEP = TILE_SIZE + TILE_MARGIN; // 17px per tile
  var RENDER_TILE_SIZE = 32; // Rendered size on screen

  var FONT_FAMILY = "'Chika', 'MokoMori', sans-serif";
  var FONT = {
    h1: "bold 48px " + FONT_FAMILY,
    h2: "bold 36px " + FONT_FAMILY,
    h3: "bold 28px " + FONT_FAMILY,
    h4: "22px " + FONT_FAMILY,
    h5: "18px " + FONT_FAMILY,
    small: "14px " + FONT_FAMILY,
    player: "42px " + FONT_FAMILY,
    enemyLarge: "32px " + FONT_FAMILY,
    enemyMedium: "24px " + FONT_FAMILY,
    civilian: "24px " + FONT_FAMILY,
    follower: "18px " + FONT_FAMILY,
    iconLarge: "70px " + FONT_FAMILY,
    iconMedium: "56px " + FONT_FAMILY,
    effect: "24px " + FONT_FAMILY,
    warning: "bold 56px " + FONT_FAMILY
  };
  var TILES_PER_BLOCK_X = Math.ceil(BLOCK_W / RENDER_TILE_SIZE); // 25
  var TILES_PER_BLOCK_Y = Math.ceil(BLOCK_H / RENDER_TILE_SIZE); // 19

  // Tilesheet image
  var tilesheetImg = new Image();
  var tilesheetLoaded = false;

  // Sprite images
  var spriteImages = {};
  var spritesLoaded = false;
  var SPRITE_DEFS = {
    nomin_play: { src: "sprites/nomin_play.png", w: 183, h: 173 },
    ashigaru_play: { src: "sprites/ashigaru_play.png", w: 193, h: 207 },
    shonin_play: { src: "sprites/shonin_play.png", w: 151, h: 197 },
    nobushi: { src: "sprites/nobushi.png", w: 465, h: 504 },
    nomin_npc: { src: "sprites/nomin_npc.png", w: 334, h: 470 },
    tsujigiri: { src: "sprites/tsujigiri.png", w: 438, h: 488 },
    tonosama: { src: "sprites/tonosama.png", w: 524, h: 713 },
    castle: { src: "sprites/castle.png", w: 517, h: 452 },
    house_town: { src: "sprites/house_town.png", w: 496, h: 474 },
    house_villege: { src: "sprites/house_villege.png", w: 469, h: 432 }
  };

  // Character class to sprite key mapping
  var CHAR_SPRITE_MAP = {
    farmer: "nomin_play",
    ashigaru: "ashigaru_play",
    merchant: "shonin_play",
    shonin: "shonin_play"
  };

  // Helper: draw a sprite centered at a position, with optional horizontal flip
  // targetHeight determines the rendered height; width is calculated from aspect ratio
  function drawSpriteCentered(ctx, spriteKey, x, y, targetHeight, flipH) {
    var def = SPRITE_DEFS[spriteKey];
    var img = spriteImages[spriteKey];
    if (!img) { return; }
    var aspect = def.w / def.h;
    var drawW = targetHeight * aspect;
    var drawH = targetHeight;

    ctx.save();
    if (flipH) {
      ctx.translate(x, y);
      ctx.scale(-1, 1);
      ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
    } else {
      ctx.drawImage(img, x - drawW / 2, y - drawH / 2, drawW, drawH);
    }
    ctx.restore();
  }

  function loadAllSprites(callback) {
    var keys = Object.keys(SPRITE_DEFS);
    var loaded = 0;
    var total = keys.length;
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      spriteImages[key] = new Image();
      spriteImages[key].onload = function() {
        loaded++;
        if (loaded >= total) {
          spritesLoaded = true;
          callback();
        }
      };
      spriteImages[key].onerror = function() {
        loaded++;
        if (loaded >= total) {
          spritesLoaded = true;
          callback();
        }
      };
      spriteImages[key].src = SPRITE_DEFS[key].src;
    }
  }

  // Helper: get source x,y for a tile at (col, row) in the spritesheet
  function tileSourceX(col) { return col * TILE_STEP; }
  function tileSourceY(row) { return row * TILE_STEP; }

  // ============================================================
  // TileMapper - sprite coordinates for each terrain element
  // ============================================================
  var TileMapper = {
    // Ground tiles (col, row in spritesheet)
    // Based on Kenney Roguelike RPG Pack layout: 57 cols x 31 rows, 16px+1px margin
    grass: [
      { col: 5, row: 1 },   // green floor tile (main, TMX 9858 uses)
      { col: 3, row: 1 },   // green floor variant (TMX 62 uses)
      { col: 4, row: 1 },   // green floor variant (TMX 9 uses)
      { col: 2, row: 1 },   // green floor variant (TMX 8 uses)
      { col: 1, row: 1 }    // green floor variant (TMX 1 use)
    ],
    grassDecor: [
      { col: 8, row: 16 },  // grass/flower decor (TMX overlay 58 uses)
      { col: 7, row: 16 },  // grass decor variant (TMX overlay 13 uses)
      { col: 8, row: 17 },  // grass decor variant (TMX overlay 5 uses)
      { col: 22, row: 10 }, // small plant (TMX objects 9 uses)
      { col: 7, row: 17 }   // grass decor variant
    ],
    trees: [
      { col: 16, row: 10 }, // pine tree top (TMX 66 uses)
      { col: 9, row: 7 },   // round tree top (TMX 51 uses)
      { col: 13, row: 10 }, // tree variant (TMX 9 uses)
      { col: 13, row: 9 },  // tree variant top (TMX 8 uses)
      { col: 9, row: 8 }    // round tree bottom (TMX 28 uses)
    ],
    water: [
      { col: 3, row: 2 },   // water center (TMX 6 uses)
      { col: 4, row: 2 },   // water variant (TMX 3 uses)
      { col: 2, row: 2 }    // water variant (TMX 2 uses)
    ],
    waterEdgeTop: { col: 5, row: 0 },     // grass-to-water top edge (TMX 36 uses)
    waterEdgeBottom: { col: 3, row: 2 },   // water bottom edge
    waterEdgeLeft: { col: 0, row: 1 },     // water left edge (TMX 2 uses)
    waterEdgeRight: { col: 5, row: 1 },    // water right edge
    stonePath: [
      { col: 9, row: 14 },  // gray stone floor (TMX 21 uses)
      { col: 16, row: 15 }, // stone variant (TMX 5 uses)
      { col: 14, row: 15 }, // stone variant (TMX 4 uses)
      { col: 13, row: 15 }  // stone variant (TMX 4 uses)
    ],
    stoneWall: [
      { col: 20, row: 21 }, // castle wall block (TMX roof 3 uses)
      { col: 21, row: 21 }, // wall variant (TMX roof 3 uses)
      { col: 20, row: 22 }, // wall variant (TMX roof 2 uses)
      { col: 21, row: 22 }  // wall variant (TMX roof 3 uses)
    ],
    castleTower: { col: 52, row: 9 },     // tower tile (TMX roof 2 uses)
    castleDoor: { col: 23, row: 24 },     // gate/door tile (TMX roof 1 use)
    treeTall: [
      { top: { col: 16, row: 9 }, bottom: { col: 16, row: 10 } },
      { top: { col: 9, row: 7 }, bottom: { col: 9, row: 8 } }
    ],
    house: [
      { col: 46, row: 10 }, // house top-left (TMX 3 uses)
      { col: 47, row: 10 }, // house top-right (TMX 3 uses)
      { col: 46, row: 11 }, // house bottom-left (TMX 3 uses)
      { col: 47, row: 11 }, // house bottom-right (TMX 3 uses)
      { col: 34, row: 21 }  // building variant (TMX 2 uses)
    ],
    dirtPath: [
      { col: 18, row: 15 }, // brown dirt path (TMX 11 uses)
      { col: 17, row: 15 }, // dirt variant (TMX 6 uses)
      { col: 19, row: 15 }, // dirt variant (TMX 6 uses)
      { col: 8, row: 14 }   // dirt path variant
    ],
    mountain: [
      { col: 48, row: 24 }, // rock/mountain (TMX 10 uses)
      { col: 51, row: 24 }, // rock variant (TMX 2 uses)
      { col: 50, row: 10 }, // rock outcrop
      { col: 48, row: 24 }  // mountain repeat
    ],
    mountainRock: [
      { col: 48, row: 24 }, // big rock (TMX 10 uses)
      { col: 51, row: 24 }  // rock pile (TMX 2 uses)
    ],
    bridgeHorizontal: [
      { col: 28, row: 9 },  // bridge plank (TMX 4 uses)
      { col: 29, row: 9 },  // bridge plank variant (TMX 4 uses)
      { col: 28, row: 8 },  // bridge rail
      { col: 29, row: 8 }   // bridge rail variant (TMX 2 uses)
    ],

    // Get a random tile from an array using a seeded-ish approach
    pickTile: function(tileArray, seed) {
      var idx = Math.abs(seed) % tileArray.length;
      return tileArray[idx];
    },

    // Draw a single tile from the spritesheet
    drawTile: function(ctx, tileCoord, destX, destY, destSize) {
      if (!tilesheetLoaded) { return; }
      var sx = tileSourceX(tileCoord.col);
      var sy = tileSourceY(tileCoord.row);
      ctx.drawImage(
        tilesheetImg,
        sx, sy, TILE_SIZE, TILE_SIZE,
        destX, destY, destSize, destSize
      );
    }
  };

  // ============================================================
  // TerrainTileCache - pre-rendered terrain block canvases
  // ============================================================
  var TerrainTileCache = {
    blockCanvases: {},
    decorations: {},

    clear: function() {
      this.blockCanvases = {};
      this.decorations = {};
    },

    // Generate a pseudo-random number from block position
    _seed: function(r, c, x, y) {
      return ((r * 7919 + c * 6271 + x * 3571 + y * 2089) & 0x7fffffff);
    },

    buildBlockCanvas: function(blockType, blockRow, blockCol) {
      var key = blockRow + "_" + blockCol;
      if (this.blockCanvases[key]) { return this.blockCanvases[key]; }

      var offCanvas = document.createElement("canvas");
      offCanvas.width = BLOCK_W;
      offCanvas.height = BLOCK_H;
      var offCtx = offCanvas.getContext("2d");

      this._renderBlockTiles(offCtx, blockType, blockRow, blockCol);

      this.blockCanvases[key] = offCanvas;
      return offCanvas;
    },

    _renderBlockTiles: function(offCtx, blockType, blockRow, blockCol) {
      var self = this;

      if (blockType === TERRAIN_TYPES.GRASSLAND) {
        self._fillGrass(offCtx, blockRow, blockCol);
        self._scatterGrassDecor(offCtx, blockRow, blockCol);
      } else if (blockType === TERRAIN_TYPES.VILLAGE) {
        self._fillGrass(offCtx, blockRow, blockCol);
        self._placeHouses(offCtx, blockRow, blockCol, 4);
        self._scatterGrassDecor(offCtx, blockRow, blockCol);
      } else if (blockType === TERRAIN_TYPES.CASTLE_TOWN) {
        self._fillStonePath(offCtx, blockRow, blockCol);
        self._placeHouses(offCtx, blockRow, blockCol, 6);
      } else if (blockType === TERRAIN_TYPES.CASTLE) {
        self._fillCastle(offCtx, blockRow, blockCol);
      } else if (blockType === TERRAIN_TYPES.MOUNTAIN) {
        self._fillDirt(offCtx, blockRow, blockCol);
        self._scatterMountainRocks(offCtx, blockRow, blockCol);
      } else if (blockType === TERRAIN_TYPES.EMPTY) {
        self._fillForest(offCtx, blockRow, blockCol);
      }
    },

    _fillGrass: function(offCtx, bRow, bCol) {
      for (var tx = 0; tx < TILES_PER_BLOCK_X; tx++) {
        for (var ty = 0; ty < TILES_PER_BLOCK_Y; ty++) {
          var seed = this._seed(bRow, bCol, tx, ty);
          var tile = TileMapper.pickTile(TileMapper.grass, seed);
          TileMapper.drawTile(offCtx, tile, tx * RENDER_TILE_SIZE, ty * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        }
      }
    },

    _scatterGrassDecor: function(offCtx, bRow, bCol) {
      for (var d = 0; d < 12; d++) {
        var seed = this._seed(bRow, bCol, d, 999);
        var dx = (seed % (TILES_PER_BLOCK_X - 2)) + 1;
        var seed2 = this._seed(bRow, bCol, d, 888);
        var dy = (seed2 % (TILES_PER_BLOCK_Y - 2)) + 1;
        var tile = TileMapper.pickTile(TileMapper.grassDecor, seed + d);
        TileMapper.drawTile(offCtx, tile, dx * RENDER_TILE_SIZE, dy * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
      }
    },

    _fillStonePath: function(offCtx, bRow, bCol) {
      for (var tx = 0; tx < TILES_PER_BLOCK_X; tx++) {
        for (var ty = 0; ty < TILES_PER_BLOCK_Y; ty++) {
          var seed = this._seed(bRow, bCol, tx, ty);
          var tile = TileMapper.pickTile(TileMapper.stonePath, seed);
          TileMapper.drawTile(offCtx, tile, tx * RENDER_TILE_SIZE, ty * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        }
      }
    },

    _fillDirt: function(offCtx, bRow, bCol) {
      for (var tx = 0; tx < TILES_PER_BLOCK_X; tx++) {
        for (var ty = 0; ty < TILES_PER_BLOCK_Y; ty++) {
          var seed = this._seed(bRow, bCol, tx, ty);
          var tile = TileMapper.pickTile(TileMapper.dirtPath, seed);
          TileMapper.drawTile(offCtx, tile, tx * RENDER_TILE_SIZE, ty * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        }
      }
    },

    _fillCastle: function(offCtx, bRow, bCol) {
      // Stone floor base
      for (var tx = 0; tx < TILES_PER_BLOCK_X; tx++) {
        for (var ty = 0; ty < TILES_PER_BLOCK_Y; ty++) {
          var seed = this._seed(bRow, bCol, tx, ty);
          var tile = TileMapper.pickTile(TileMapper.stonePath, seed);
          TileMapper.drawTile(offCtx, tile, tx * RENDER_TILE_SIZE, ty * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        }
      }
      // Castle walls along the edges
      for (var wx = 0; wx < TILES_PER_BLOCK_X; wx++) {
        var seedTop = this._seed(bRow, bCol, wx, 0);
        TileMapper.drawTile(offCtx, TileMapper.pickTile(TileMapper.stoneWall, seedTop), wx * RENDER_TILE_SIZE, 0, RENDER_TILE_SIZE);
        TileMapper.drawTile(offCtx, TileMapper.pickTile(TileMapper.stoneWall, seedTop + 1), wx * RENDER_TILE_SIZE, RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        var seedBot = this._seed(bRow, bCol, wx, TILES_PER_BLOCK_Y - 1);
        TileMapper.drawTile(offCtx, TileMapper.pickTile(TileMapper.stoneWall, seedBot), wx * RENDER_TILE_SIZE, (TILES_PER_BLOCK_Y - 2) * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        TileMapper.drawTile(offCtx, TileMapper.pickTile(TileMapper.stoneWall, seedBot + 1), wx * RENDER_TILE_SIZE, (TILES_PER_BLOCK_Y - 1) * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
      }
      for (var wy = 2; wy < TILES_PER_BLOCK_Y - 2; wy++) {
        var seedL = this._seed(bRow, bCol, 0, wy);
        TileMapper.drawTile(offCtx, TileMapper.pickTile(TileMapper.stoneWall, seedL), 0, wy * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        TileMapper.drawTile(offCtx, TileMapper.pickTile(TileMapper.stoneWall, seedL + 1), RENDER_TILE_SIZE, wy * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        var seedR = this._seed(bRow, bCol, TILES_PER_BLOCK_X - 1, wy);
        TileMapper.drawTile(offCtx, TileMapper.pickTile(TileMapper.stoneWall, seedR), (TILES_PER_BLOCK_X - 2) * RENDER_TILE_SIZE, wy * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        TileMapper.drawTile(offCtx, TileMapper.pickTile(TileMapper.stoneWall, seedR + 1), (TILES_PER_BLOCK_X - 1) * RENDER_TILE_SIZE, wy * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
      }
      // Castle towers at corners
      TileMapper.drawTile(offCtx, TileMapper.castleTower, RENDER_TILE_SIZE, RENDER_TILE_SIZE, RENDER_TILE_SIZE * 2);
      TileMapper.drawTile(offCtx, TileMapper.castleTower, (TILES_PER_BLOCK_X - 3) * RENDER_TILE_SIZE, RENDER_TILE_SIZE, RENDER_TILE_SIZE * 2);
      TileMapper.drawTile(offCtx, TileMapper.castleTower, RENDER_TILE_SIZE, (TILES_PER_BLOCK_Y - 4) * RENDER_TILE_SIZE, RENDER_TILE_SIZE * 2);
      TileMapper.drawTile(offCtx, TileMapper.castleTower, (TILES_PER_BLOCK_X - 3) * RENDER_TILE_SIZE, (TILES_PER_BLOCK_Y - 4) * RENDER_TILE_SIZE, RENDER_TILE_SIZE * 2);
      // Gate in center
      var cx = Math.floor(TILES_PER_BLOCK_X / 2);
      var cy = Math.floor(TILES_PER_BLOCK_Y / 2);
      TileMapper.drawTile(offCtx, TileMapper.castleDoor, cx * RENDER_TILE_SIZE, cy * RENDER_TILE_SIZE, RENDER_TILE_SIZE * 2);
    },

    _fillForest: function(offCtx, bRow, bCol) {
      // Grass base
      this._fillGrass(offCtx, bRow, bCol);
      // 2タイル高の木（treeTall）を先に描画（下のレイヤー）
      for (var t = 0; t < 8; t++) {
        var tallSeed = this._seed(bRow, bCol, t, 888);
        var tallIdx = Math.abs(tallSeed) % TileMapper.treeTall.length;
        var tallTree = TileMapper.treeTall[tallIdx];
        var tallSeed2 = this._seed(bRow, bCol, t, 899);
        var tx = tallSeed % (TILES_PER_BLOCK_X - 1);
        var ty = tallSeed2 % (TILES_PER_BLOCK_Y - 2);
        // 上部タイルを描画
        TileMapper.drawTile(offCtx, tallTree.top, tx * RENDER_TILE_SIZE, ty * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        // 下部タイルを描画（1タイル下）
        TileMapper.drawTile(offCtx, tallTree.bottom, tx * RENDER_TILE_SIZE, (ty + 1) * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
      }
    },

    _placeHouses: function(offCtx, bRow, bCol, count) {
      // Houses are now drawn as game objects, not terrain tiles
      // This function is intentionally empty
    },

    _scatterMountainRocks: function(offCtx, bRow, bCol) {
      // Mountain tiles removed - fill with dense forest instead
      this._fillForest(offCtx, bRow, bCol);
    },

    // Build a vertical river strip canvas (full map height)
    buildRiverCanvas: function(riverX, riverW) {
      var key = "river_" + riverX + "_" + riverW;
      if (this.blockCanvases[key]) { return this.blockCanvases[key]; }

      var offCanvas = document.createElement("canvas");
      offCanvas.width = riverW + RENDER_TILE_SIZE * 2; // extra for edge tiles
      offCanvas.height = MAP_H;
      var offCtx = offCanvas.getContext("2d");

      var tilesWide = Math.ceil(riverW / RENDER_TILE_SIZE);
      var tilesHigh = Math.ceil(MAP_H / RENDER_TILE_SIZE);

      // Left edge
      for (var ey = 0; ey < tilesHigh; ey++) {
        TileMapper.drawTile(offCtx, TileMapper.waterEdgeLeft, 0, ey * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
      }

      // Water body
      for (var wx = 0; wx < tilesWide; wx++) {
        for (var wy = 0; wy < tilesHigh; wy++) {
          var seed = (wx * 3571 + wy * 2089) & 0x7fffffff;
          var tile = TileMapper.pickTile(TileMapper.water, seed);
          TileMapper.drawTile(offCtx, tile, (wx + 1) * RENDER_TILE_SIZE, wy * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        }
      }

      // Right edge
      for (var ry = 0; ry < tilesHigh; ry++) {
        TileMapper.drawTile(offCtx, TileMapper.waterEdgeRight, (tilesWide + 1) * RENDER_TILE_SIZE, ry * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
      }

      this.blockCanvases[key] = offCanvas;
      return offCanvas;
    },

    // Build a bridge canvas
    buildBridgeCanvas: function(bridgeW, bridgeH, bridgeIdx) {
      var key = "bridge_" + bridgeIdx;
      if (this.blockCanvases[key]) { return this.blockCanvases[key]; }

      var offCanvas = document.createElement("canvas");
      offCanvas.width = bridgeW;
      offCanvas.height = bridgeH;
      var offCtx = offCanvas.getContext("2d");

      var tilesWide = Math.ceil(bridgeW / RENDER_TILE_SIZE);
      var tilesHigh = Math.ceil(bridgeH / RENDER_TILE_SIZE);

      for (var bx = 0; bx < tilesWide; bx++) {
        for (var by = 0; by < tilesHigh; by++) {
          var seed = (bx * 127 + by * 311 + bridgeIdx * 997) & 0x7fffffff;
          var tile = TileMapper.pickTile(TileMapper.bridgeHorizontal, seed);
          TileMapper.drawTile(offCtx, tile, bx * RENDER_TILE_SIZE, by * RENDER_TILE_SIZE, RENDER_TILE_SIZE);
        }
      }

      this.blockCanvases[key] = offCanvas;
      return offCanvas;
    }
  };

  // ============================================================

  var gameState = {

    kokuPerSecond: 0

  var dialogCallback = null;

  // ============================================================
  // InputManager
  // ============================================================
  var InputManager = {
    keys: { w: false, a: false, s: false, d: false, space: false, q: false },
    mouseX: 400,
    mouseY: 300,
    mouseWorldX: 400,
    mouseWorldY: 300,
    leftClick: false,
    rightClick: false,

    init: function() {
      var self = this;
      document.addEventListener("keydown", function(e) {
        if (e.code === "KeyW") { self.keys.w = true; }
        if (e.code === "KeyA") { self.keys.a = true; }
        if (e.code === "KeyS") { self.keys.s = true; }
        if (e.code === "KeyD") { self.keys.d = true; }
        if (e.code === "Space") {
          e.preventDefault();
          self.keys.space = true;
        }
        if (e.code === "KeyQ") { self.keys.q = true; }
      });
      document.addEventListener("keyup", function(e) {
        if (e.code === "KeyW") { self.keys.w = false; }
        if (e.code === "KeyA") { self.keys.a = false; }
        if (e.code === "KeyS") { self.keys.s = false; }
        if (e.code === "KeyD") { self.keys.d = false; }
        if (e.code === "Space") { self.keys.space = false; }
        if (e.code === "KeyQ") { self.keys.q = false; }
      });
      canvas.addEventListener("mousemove", function(e) {
        var rect = canvas.getBoundingClientRect();
        self.mouseX = e.clientX - rect.left;
        self.mouseY = e.clientY - rect.top;
        self.mouseWorldX = self.mouseX + CameraController.x;
        self.mouseWorldY = self.mouseY + CameraController.y;
      });
      canvas.addEventListener("click", function() {
        self.leftClick = true;
      });
      canvas.addEventListener("contextmenu", function(e) {
        e.preventDefault();
        self.rightClick = true;
      });
    },

    consumeLeftClick: function() {
      if (this.leftClick) { this.leftClick = false; return true; }
      return false;
    },

    consumeRightClick: function() {
      if (this.rightClick) { this.rightClick = false; return true; }
      return false;
    },

    consumeSpace: function() {
      if (this.keys.space) { this.keys.space = false; return true; }
      return false;
    },

    consumeQ: function() {
      if (this.keys.q) { this.keys.q = false; return true; }
      return false;
    },

    updateWorldMouse: function() {
      this.mouseWorldX = this.mouseX + CameraController.x;
      this.mouseWorldY = this.mouseY + CameraController.y;
    }
  };

  // ============================================================
  // MapGenerator
  // ============================================================
  var MapGenerator = {
    grid: null,
    castleBlock: null,
    playerBlock: null,
    bridges: [],
    riverPath: null,

    generate: function() {
      this.grid = [];
      for (var r = 0; r < 3; r++) {
        this.grid[r] = [];
        for (var c = 0; c < 3; c++) {
          this.grid[r][c] = TERRAIN_TYPES.EMPTY;
        }
      }

      // Castle on outer ring
      var outerBlocks = [
        [0,0],[0,1],[0,2],[1,0],[1,2],[2,0],[2,1],[2,2]
      ];
      var castleIdx = Math.floor(Math.random() * outerBlocks.length);
      this.castleBlock = { r: outerBlocks[castleIdx][0], c: outerBlocks[castleIdx][1] };
      this.grid[this.castleBlock.r][this.castleBlock.c] = TERRAIN_TYPES.CASTLE;

      // Player at least 2 blocks away
      var candidates = [];
      for (var pr = 0; pr < 3; pr++) {
        for (var pc = 0; pc < 3; pc++) {
          var dist = Math.abs(pr - this.castleBlock.r) + Math.abs(pc - this.castleBlock.c);
          if (dist >= 2) { candidates.push({ r: pr, c: pc }); }
        }
      }
      var pIdx = Math.floor(Math.random() * candidates.length);
      this.playerBlock = candidates[pIdx];

      // Castle town adjacent to castle
      var adjList = this._getAdjacent(this.castleBlock.r, this.castleBlock.c);
      for (var ai = 0; ai < adjList.length; ai++) {
        if (this.grid[adjList[ai].r][adjList[ai].c] === TERRAIN_TYPES.EMPTY) {
          this.grid[adjList[ai].r][adjList[ai].c] = TERRAIN_TYPES.CASTLE_TOWN;
          break;
        }
      }

      // Mountain on shortest path
      var midR = Math.round((this.castleBlock.r + this.playerBlock.r) / 2);
      var midC = Math.round((this.castleBlock.c + this.playerBlock.c) / 2);
      if (this.grid[midR][midC] === TERRAIN_TYPES.EMPTY) {
        this.grid[midR][midC] = TERRAIN_TYPES.MOUNTAIN;
      }

      // Grasslands near player
      var grassCount = 0;
      for (var gr = 0; gr < 3; gr++) {
        for (var gc = 0; gc < 3; gc++) {
          if (grassCount >= 3) { break; }
          if (this.grid[gr][gc] === TERRAIN_TYPES.EMPTY) {
            var pd = Math.abs(gr - this.playerBlock.r) + Math.abs(gc - this.playerBlock.c);
            if (pd <= 2 && Math.random() < 0.6) {
              this.grid[gr][gc] = TERRAIN_TYPES.GRASSLAND;
              grassCount++;
            }
          }
        }
      }

      // Villages
      for (var vr = 0; vr < 3; vr++) {
        for (var vc = 0; vc < 3; vc++) {
          if (this.grid[vr][vc] === TERRAIN_TYPES.EMPTY && Math.random() < 0.4) {
            this.grid[vr][vc] = TERRAIN_TYPES.VILLAGE;
          }
        }
      }

      // Generate river between castle and player
      this._generateRiver();

      // Build terrain data
      TerrainManager.buildFromGrid(this.grid, this.bridges, this.riverPath);
    },

    _getAdjacent: function(r, c) {
      var result = [];
      if (r > 0) { result.push({ r: r - 1, c: c }); }
      if (r < 2) { result.push({ r: r + 1, c: c }); }
      if (c > 0) { result.push({ r: r, c: c - 1 }); }
      if (c < 2) { result.push({ r: r, c: c + 1 }); }
      return result;
    },

    _generateRiver: function() {
      // Vertical river crosses between castle and player columns
      var castleCX = this.castleBlock.c * BLOCK_W + BLOCK_W / 2;
      var playerCX = this.playerBlock.c * BLOCK_W + BLOCK_W / 2;
      var riverX = (castleCX + playerCX) / 2;
      // Clamp
      if (riverX < 400) { riverX = 400; }
      if (riverX > 1400) { riverX = 1400; }

      // Random river width: 60px to 150px
      var riverWidth = 60 + Math.floor(Math.random() * 91);

      this.riverPath = {
        x: riverX,
        width: riverWidth
      };

      // Two horizontal bridges crossing the vertical river
      var nearBridgeY = 200 + Math.random() * 600;
      var farBridgeY = 1200 + Math.random() * 800;
      var bridgeW = riverWidth + 20;
      this.bridges = [
        { x: riverX - 10, y: nearBridgeY, w: bridgeW, h: 70, safe: false },
        { x: riverX - 10, y: farBridgeY, w: bridgeW, h: 120, safe: true }
      ];
    },

    getCastleWorldPos: function() {
      return {
        x: this.castleBlock.c * BLOCK_W + BLOCK_W / 2,
        y: this.castleBlock.r * BLOCK_H + BLOCK_H / 2
      };
    },

    getPlayerStartPos: function() {
      return {
        x: this.playerBlock.c * BLOCK_W + BLOCK_W / 2,
        y: this.playerBlock.r * BLOCK_H + BLOCK_H / 2
      };
    }
  };

  // ============================================================
  // TerrainManager
  // ============================================================
  var TerrainManager = {
    blocks: [],
    riverX: 0,
    riverW: 50,
    bridges: [],

    buildFromGrid: function(grid, bridges, riverPath) {
      this.blocks = [];
      this.bridges = bridges;
      if (riverPath) {
        this.riverX = riverPath.x;
        this.riverW = riverPath.width;
      }

      for (var r = 0; r < 3; r++) {
        for (var c = 0; c < 3; c++) {
          this.blocks.push({
            type: grid[r][c],
            x: c * BLOCK_W,
            y: r * BLOCK_H,
            w: BLOCK_W,
            h: BLOCK_H,
            row: r,
            col: c
          });
        }
      }
    },

    isInRiver: function(x, y) {
      if (x >= this.riverX && x <= this.riverX + this.riverW) {
        for (var i = 0; i < this.bridges.length; i++) {
          var b = this.bridges[i];
          if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
            return false;
          }
        }
        return true;
      }
      return false;
    },

    isOnBridge: function(x, y) {
      for (var i = 0; i < this.bridges.length; i++) {
        var b = this.bridges[i];
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
          return true;
        }
      }
      return false;
    },

    isInGrassland: function(x, y) {
      for (var i = 0; i < this.blocks.length; i++) {
        var bl = this.blocks[i];
        if (bl.type === TERRAIN_TYPES.GRASSLAND) {
          if (x >= bl.x && x <= bl.x + bl.w && y >= bl.y && y <= bl.y + bl.h) {
            return true;
          }
        }
      }
      return false;
    },

    getTerrainAt: function(x, y) {
      for (var i = 0; i < this.blocks.length; i++) {
        var bl = this.blocks[i];
        if (x >= bl.x && x <= bl.x + bl.w && y >= bl.y && y <= bl.y + bl.h) {
          return bl.type;
        }
      }
      return TERRAIN_TYPES.EMPTY;
    },

    clampPosition: function(x, y) {
      var nx = x;
      var ny = y;
      if (nx < 15) { nx = 15; }
      if (nx > MAP_W - 15) { nx = MAP_W - 15; }
      if (ny < 15) { ny = 15; }
      if (ny > MAP_H - 15) { ny = MAP_H - 15; }
      return { x: nx, y: ny };
    }
  };

  // ============================================================
  // CameraController
  // ============================================================
  var CameraController = {
    x: 0,
    y: 0,
    deadZone: 80,

    follow: function(targetX, targetY) {
      var screenX = targetX - this.x;
      var screenY = targetY - this.y;
      var centerX = CANVAS_W / 2;
      var centerY = CANVAS_H / 2;

      if (screenX < centerX - this.deadZone) {
        this.x = targetX - (centerX - this.deadZone);
      }
      if (screenX > centerX + this.deadZone) {
        this.x = targetX - (centerX + this.deadZone);
      }
      if (screenY < centerY - this.deadZone) {
        this.y = targetY - (centerY - this.deadZone);
      }
      if (screenY > centerY + this.deadZone) {
        this.y = targetY - (centerY + this.deadZone);
      }

      // Clamp camera
      if (this.x < 0) { this.x = 0; }
      if (this.y < 0) { this.y = 0; }
      if (this.x > MAP_W - CANVAS_W) { this.x = MAP_W - CANVAS_W; }
      if (this.y > MAP_H - CANVAS_H) { this.y = MAP_H - CANVAS_H; }
    },

    worldToScreen: function(wx, wy) {
      return { x: wx - this.x, y: wy - this.y };
    },

    isVisible: function(wx, wy, margin) {
      var m = margin;
      if (m === undefined) { m = 50; }
      return wx >= this.x - m && wx <= this.x + CANVAS_W + m &&
             wy >= this.y - m && wy <= this.y + CANVAS_H + m;
    }
  };

  // ============================================================
  // MinimapRenderer
  // ============================================================
  var MinimapRenderer = {
    draw: function(ctx) {
      var mx = MINIMAP_X;
      var my = MINIMAP_Y;
      var scaleX = MINIMAP_W / MAP_W;
      var scaleY = MINIMAP_H / MAP_H;

      // Background
      ctx.fillStyle = "rgba(240, 240, 240, 0.85)";
      ctx.fillRect(mx, my, MINIMAP_W, MINIMAP_H);
      ctx.strokeStyle = "rgba(0, 0, 0, 0.6)";
      ctx.lineWidth = 1;
      ctx.strokeRect(mx, my, MINIMAP_W, MINIMAP_H);

      // Terrain blocks
      for (var i = 0; i < TerrainManager.blocks.length; i++) {
        var bl = TerrainManager.blocks[i];
        var bx = mx + bl.x * scaleX;
        var by = my + bl.y * scaleY;
        var bw = bl.w * scaleX;
        var bh = bl.h * scaleY;
        if (bl.type === TERRAIN_TYPES.CASTLE) {
          ctx.fillStyle = "rgba(200, 60, 60, 0.5)";
          ctx.fillRect(bx, by, bw, bh);
        } else if (bl.type === TERRAIN_TYPES.GRASSLAND) {
          ctx.fillStyle = "rgba(100, 160, 80, 0.3)";
          ctx.fillRect(bx, by, bw, bh);
        } else if (bl.type === TERRAIN_TYPES.CASTLE_TOWN) {
          ctx.fillStyle = "rgba(100, 100, 100, 0.2)";
          ctx.fillRect(bx, by, bw, bh);
        } else if (bl.type === TERRAIN_TYPES.MOUNTAIN) {
          ctx.fillStyle = "rgba(100, 100, 100, 0.2)";
          ctx.fillRect(bx, by, bw, bh);
        } else if (bl.type === TERRAIN_TYPES.VILLAGE) {
          ctx.fillStyle = "rgba(100, 100, 100, 0.15)";
          ctx.fillRect(bx, by, bw, bh);
        }
      }

      // River
      ctx.fillStyle = "rgba(100, 140, 200, 0.4)";
      ctx.fillRect(mx + TerrainManager.riverX * scaleX, my, TerrainManager.riverW * scaleX, MINIMAP_H);

      // Bridges
      ctx.fillStyle = "rgba(100, 100, 100, 0.5)";
      for (var bi = 0; bi < TerrainManager.bridges.length; bi++) {
        var br = TerrainManager.bridges[bi];
        ctx.fillRect(mx + br.x * scaleX, my + br.y * scaleY, br.w * scaleX, br.h * scaleY);
      }

      // Castle red icon
      var castlePos = MapGenerator.getCastleWorldPos();
      ctx.fillStyle = "#c03030";
      ctx.fillRect(mx + castlePos.x * scaleX - 3, my + castlePos.y * scaleY - 3, 6, 6);

      // Civilians (green dots)
      ctx.fillStyle = "rgba(80, 160, 80, 0.6)";
      var civs = CivilianManager.civilians;
      for (var ci = 0; ci < civs.length; ci++) {
        ctx.fillRect(mx + civs[ci].x * scaleX - 1, my + civs[ci].y * scaleY - 1, 2, 2);
      }

      // Player (white)
      var px = mx + PlayerController.x * scaleX;
      var py = my + PlayerController.y * scaleY;
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#1a1a1a";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Camera viewport
      ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
      ctx.lineWidth = 1;
      ctx.strokeRect(mx + CameraController.x * scaleX, my + CameraController.y * scaleY, CANVAS_W * scaleX, CANVAS_H * scaleY);
    }
  };

  // ============================================================
  // PlayerController
  // ============================================================
  var PlayerController = {
    x: 0, y: 0,
    hp: 100, maxHp: 100,
    size: 36,
    facingLeft: false,
    knockbackTimer: 0,
    knockbackDirX: 0,
    knockbackDirY: 0,
    attackCooldown: 0,
    chargeCooldown: 0,

    init: function(startPos) {
      var def = gameState.charDef;
      this.x = startPos.x;
      this.y = startPos.y;
      this.hp = 100;
      this.maxHp = 100;
      this.size = 36;
      this.facingLeft = false;
      this.knockbackTimer = 0;
      this.attackCooldown = 0;
      this.chargeCooldown = 0;
    },

    update: function(dt) {
      var def = gameState.charDef;
      if (this.attackCooldown > 0) { this.attackCooldown -= dt; }

      if (this.chargeCooldown > 0) { this.chargeCooldown -= dt; }

      // HP regen
      if (this.hp < this.maxHp) {
        this.hp += dt * 2;
        if (this.hp > this.maxHp) { this.hp = this.maxHp; }
      }

      // Knockback
      if (this.knockbackTimer > 0) {
        var prevX = this.x;
        var prevY = this.y;
        this.x += this.knockbackDirX;
        this.y += this.knockbackDirY;
        if (TerrainManager.isInRiver(this.x, this.y)) {
          this.x = prevX;
          this.y = prevY;
        }
        this.knockbackTimer -= dt;
        this.knockbackDirX *= 0.9;
        this.knockbackDirY *= 0.9;
      }

      if (this.knockbackTimer <= 0) {
        // WASD movement
        var prevX2 = this.x;
        var prevY2 = this.y;
        var spd = def.speed + (ScoreManager.rankIndex * 0.3);
        // Farmer buff from parade (2.5% per follower to all stats)
        if (gameState.selectedChar === "farmer") {
          spd = spd * (1.0 + ParadeController.getLength() * 0.025);
        }
        if (InputManager.keys.w) { this.y -= spd; }
        if (InputManager.keys.s) { this.y += spd; }
        if (InputManager.keys.a) { this.x -= spd; this.facingLeft = true; }
        if (InputManager.keys.d) { this.x += spd; this.facingLeft = false; }
        if (TerrainManager.isInRiver(this.x, this.y)) {
          this.x = prevX2;
          this.y = prevY2;
        }
      }

      // Clamp
      var clamped = TerrainManager.clampPosition(this.x, this.y);
      this.x = clamped.x;
      this.y = clamped.y;

      // Building collision
      var playerBlockRow = Math.floor(this.y / BLOCK_H);
      var playerBlockCol = Math.floor(this.x / BLOCK_W);
      if (playerBlockRow < 0) { playerBlockRow = 0; }
      if (playerBlockRow > 2) { playerBlockRow = 2; }
      if (playerBlockCol < 0) { playerBlockCol = 0; }
      if (playerBlockCol > 2) { playerBlockCol = 2; }
      var terrainAtPlayer = TerrainManager.getTerrainAt(this.x, this.y);
      if (terrainAtPlayer === TERRAIN_TYPES.VILLAGE || terrainAtPlayer === TERRAIN_TYPES.CASTLE_TOWN) {
        var blockHouses = HouseManager.getHouses(playerBlockRow, playerBlockCol);
        var blockOriginX = playerBlockCol * BLOCK_W;
        var blockOriginY = playerBlockRow * BLOCK_H;
        for (var hi = 0; hi < blockHouses.length; hi++) {
          var house = blockHouses[hi];
          var houseWorldX = blockOriginX + house.x;
          var houseWorldY = blockOriginY + house.y;
          var hdx = this.x - houseWorldX;
          var hdy = this.y - houseWorldY;
          var hDist = Math.sqrt(hdx * hdx + hdy * hdy);
          var minDist = house.collisionRadius + this.size;
          if (hDist < minDist && hDist > 0) {
            var pushX = (hdx / hDist) * (minDist - hDist);
            var pushY = (hdy / hDist) * (minDist - hDist);
            this.x += pushX;
            this.y += pushY;
          }
        }
      }

      // SPACE is reserved for Tsujigiri QTE only
    },

    applyKnockback: function(dirX, dirY, force) {
      this.knockbackTimer = 0.3;
      var dist = Math.sqrt(dirX * dirX + dirY * dirY);
      if (dist < 1) { dist = 1; }
      this.knockbackDirX = (dirX / dist) * force;
      this.knockbackDirY = (dirY / dist) * force;
    },

    takeDamage: function(amount) {
      this.hp -= amount;
      EffectRenderer.add(this.x, this.y, "playerHit");
      if (this.hp <= 0) {
        this.hp = 0;
        return true; // dead
      }
      return false;
    },

    getAttackPower: function() {
      var def = gameState.charDef;
      var base = def.attack;
      var followerBonus = Math.floor(ParadeController.getLength() * def.followerBonus * base * 10);
      return base + followerBonus;
    },

    draw: function(ctx) {
      var sp = CameraController.worldToScreen(this.x, this.y);
      if (this.knockbackTimer > 0) { ctx.globalAlpha = 0.6 + Math.sin(performance.now() * 0.05) * 0.3; }

      var spriteKey = CHAR_SPRITE_MAP[gameState.selectedChar];
      if (spritesLoaded && spriteKey) {
        var playerFlipH = false;
        if (gameState.selectedChar === "merchant") {
          playerFlipH = false;
        } else {
          playerFlipH = !this.facingLeft;
        }
        drawSpriteCentered(ctx, spriteKey, sp.x, sp.y, 80, playerFlipH);
      } else {
        ctx.font = FONT.player;
        ctx.textAlign = "center";
        ctx.fillText(gameState.charDef.emoji, sp.x, sp.y + 8);
      }
      ctx.globalAlpha = 1.0;

      // HP bar
      ctx.fillStyle = "#ddd";
      ctx.fillRect(sp.x - 20, sp.y - 45, 40, 5);
      var hpR = this.hp / this.maxHp;
      if (hpR > 0.5) { ctx.fillStyle = "#4a8"; }
      else { ctx.fillStyle = "#c44"; }
      ctx.fillRect(sp.x - 20, sp.y - 45, 40 * hpR, 5);
    }
  };

  // ============================================================
  // EnemyManager
  // ============================================================
  var EnemyManager = {
    enemies: [],
    spawnTimer: 0,
    waveAnnounced: [false, false, false],

    init: function() {
      this.enemies = [];
      this.spawnTimer = 0;
      this.waveAnnounced = [false, false, false];
    },

    spawn: function() {
      if (this.enemies.length >= 12) { return; }

      var tier = 0;
      if (gameState.gameTime > 60) { tier = 3; }
      else if (gameState.gameTime > 30) { tier = 2; }
      else if (gameState.gameTime > 15) { tier = 1; }

      var idx = Math.min(tier, Math.floor(Math.random() * (tier + 1)));
      var def = ENEMY_DEFS[idx];

      // Spawn near edges of visible area or around map
      var ex, ey;
      var edge = Math.floor(Math.random() * 4);
      var margin = 100;
      if (edge === 0) { ex = CameraController.x + Math.random() * CANVAS_W; ey = CameraController.y - margin; }
      else if (edge === 1) { ex = CameraController.x + CANVAS_W + margin; ey = CameraController.y + Math.random() * CANVAS_H; }
      else if (edge === 2) { ex = CameraController.x + Math.random() * CANVAS_W; ey = CameraController.y + CANVAS_H + margin; }
      else { ex = CameraController.x - margin; ey = CameraController.y + Math.random() * CANVAS_H; }

      // Clamp to map
      if (ex < 20) { ex = 20; }
      if (ex > MAP_W - 20) { ex = MAP_W - 20; }
      if (ey < 20) { ey = 20; }
      if (ey > MAP_H - 20) { ey = MAP_H - 20; }
      // Don't spawn in river
      if (TerrainManager.isInRiver(ex, ey)) { ex = TerrainManager.riverX - 30; }

      // Castle town enemies are stronger
      var terrType = TerrainManager.getTerrainAt(ex, ey);
      var hpMult = 1;
      if (terrType === TERRAIN_TYPES.CASTLE_TOWN) { hpMult = 1.5; }
      if (terrType === TERRAIN_TYPES.MOUNTAIN) { hpMult = 1.3; }

      this.enemies.push({
        x: ex, y: ey,
        hp: Math.floor(def.hp * hpMult), maxHp: Math.floor(def.hp * hpMult),
        attack: def.attack, speed: def.speed,
        scoreValue: def.score, size: def.size,
        emoji: def.emoji, name: def.name,
        grit: def.grit,
        attackTimer: 0,
        surrendering: false, surrenderTimer: 0,
        facingLeft: false
      });
    },

    update: function(dt) {
      // Wave announcements
      if (gameState.gameTime >= 30 && !this.waveAnnounced[0]) {
        this.waveAnnounced[0] = true;
        AnnouncementSystem.add("第二波 襲来!");
      }
      if (gameState.gameTime >= 60 && !this.waveAnnounced[1]) {
        this.waveAnnounced[1] = true;
        AnnouncementSystem.add("第三波 襲来!!");
      }

      // Spawning
      this.spawnTimer += dt;
      if (this.spawnTimer > 3) {
        this.spawnTimer = 0;
        if (this.enemies.length < 6) { this.spawn(); this.spawn(); }
        else if (this.enemies.length < 10) { this.spawn(); }
      }

      var px = PlayerController.x;
      var py = PlayerController.y;

      for (var i = this.enemies.length - 1; i >= 0; i--) {
        var en = this.enemies[i];

        // Surrendering
        if (en.surrendering) {
          en.surrenderTimer -= dt;
          if (en.surrenderTimer <= 0) {
            ScoreManager.addRaw(en.scoreValue);
            ShoninSystem.addKokuForKill(en.scoreValue);
            EffectRenderer.add(en.x, en.y, "surrender");
            this.enemies.splice(i, 1);
          }
          continue;
        }

        // AI: move toward player
        var dx = px - en.x;
        var dy = py - en.y;
        var dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 1) {
          var newX = en.x + (dx / dist) * en.speed;
          var newY = en.y + (dy / dist) * en.speed;
          // Enemy avoids river too
          if (!TerrainManager.isInRiver(newX, newY)) {
            en.x = newX;
            en.y = newY;
          }
        }

        // Melee attack on player
        if (dist < PlayerController.size + en.size) {
          en.attackTimer += dt;
          if (en.attackTimer > 0.8) {
            en.attackTimer = 0;
            var dead = PlayerController.takeDamage(en.attack);
            if (dead) {
              gameState.phase = "result";
              skullScreen.classList.add("active");
              return;
            }
          }
        }

        // All parade members are invincible (cannot die from enemy attacks)
      }
    },

    removeEnemy: function(index) {
      this.enemies.splice(index, 1);
    },

    draw: function(ctx) {
      for (var i = 0; i < this.enemies.length; i++) {
        var en = this.enemies[i];
        if (!CameraController.isVisible(en.x, en.y, 30)) { continue; }
        var sp = CameraController.worldToScreen(en.x, en.y);
        ctx.textAlign = "center";

        var facingLeft = (en.x > PlayerController.x);

        if (en.surrendering) {
          ctx.font = Math.round((en.size + 4) * 1.5) + "px " + FONT_FAMILY;
          ctx.fillText("\uD83C\uDFF3\uFE0F", sp.x, sp.y + en.size / 3);
          ctx.fillStyle = "#1a1a1a";
          ctx.font = FONT.h4;
          ctx.fillText("降伏!", sp.x, sp.y - en.size - 8);
        } else if (spritesLoaded) {
          var enemySpriteKey = "nobushi";
          if (en.name === "侍") { enemySpriteKey = "tsujigiri"; }
          if (en.name === "武将") { enemySpriteKey = "tonosama"; }
          var enemySpriteH = 32 + en.size;
          drawSpriteCentered(ctx, enemySpriteKey, sp.x, sp.y, enemySpriteH, facingLeft);
        } else {
          ctx.font = Math.round((en.size + 4) * 1.5) + "px " + FONT_FAMILY;
          ctx.save();
          if (facingLeft) {
            ctx.translate(sp.x, sp.y + en.size / 3);
            ctx.scale(-1, 1);
            ctx.fillText(en.emoji, 0, 0);
          } else {
            ctx.fillText(en.emoji, sp.x, sp.y + en.size / 3);
          }
          ctx.restore();
        }

        // HP bar
        if (en.hp < en.maxHp && !en.surrendering) {
          var hpR = en.hp / en.maxHp;
          ctx.fillStyle = "#ddd";
          ctx.fillRect(sp.x - 12, sp.y - en.size - 4, 24, 4);
          if (hpR > 0.5) { ctx.fillStyle = "#4a8"; }
          else { ctx.fillStyle = "#c44"; }
          ctx.fillRect(sp.x - 12, sp.y - en.size - 4, 24 * hpR, 4);
        }
      }
    }
  };

  // ============================================================
  // CivilianManager
  // ============================================================
  var CivilianManager = {
    civilians: [],
    spawnTimer: 0,

    init: function() {
      this.civilians = [];
      this.spawnTimer = 0;
    },

    spawn: function() {
      if (this.civilians.length >= 20) { return; }
      var cx, cy;

      // Build weighted block list based on terrain spawn rates
      var weightedBlocks = [];
      for (var i = 0; i < TerrainManager.blocks.length; i++) {
        var bl = TerrainManager.blocks[i];
        var weight = 1.0;
        if (bl.type === TERRAIN_TYPES.VILLAGE || bl.type === TERRAIN_TYPES.CASTLE_TOWN) {
          weight = 2.0;
        } else if (bl.type === TERRAIN_TYPES.GRASSLAND) {
          weight = 1.0;
        } else if (bl.type === TERRAIN_TYPES.MOUNTAIN || bl.type === TERRAIN_TYPES.RIVER) {
          weight = 0.5;
        } else if (bl.type === TERRAIN_TYPES.CASTLE) {
          weight = 0;
        }
        if (weight > 0) {
          weightedBlocks.push({ block: bl, weight: weight });
        }
      }

      // Weighted random selection
      var totalWeight = 0;
      for (var wi = 0; wi < weightedBlocks.length; wi++) {
        totalWeight += weightedBlocks[wi].weight;
      }
      var roll = Math.random() * totalWeight;
      var cumulative = 0;
      var selectedBlock = null;
      for (var si = 0; si < weightedBlocks.length; si++) {
        cumulative += weightedBlocks[si].weight;
        if (roll <= cumulative) {
          selectedBlock = weightedBlocks[si].block;
          break;
        }
      }

      if (selectedBlock) {
        cx = selectedBlock.x + 50 + Math.random() * (selectedBlock.w - 100);
        cy = selectedBlock.y + 50 + Math.random() * (selectedBlock.h - 100);
      } else {
        cx = 50 + Math.random() * (MAP_W - 100);
        cy = 50 + Math.random() * (MAP_H - 100);
      }

      if (TerrainManager.isInRiver(cx, cy)) { cx = TerrainManager.riverX - 30; }
      this.civilians.push({
        x: cx, y: cy,
        wanderAngle: Math.random() * Math.PI * 2,
        wanderTimer: 0,
        recruitTimer: 0
      });
    },

    update: function(dt) {
      var def = gameState.charDef;
      this.spawnTimer += dt;
      if (this.spawnTimer > 4) {
        this.spawnTimer = 0;
        if (this.civilians.length < 15) { this.spawn(); }
      }

      for (var i = this.civilians.length - 1; i >= 0; i--) {
        var civ = this.civilians[i];
        // Wander
        civ.wanderTimer += dt;
        if (civ.wanderTimer > 2) { civ.wanderTimer = 0; civ.wanderAngle = Math.random() * Math.PI * 2; }
        civ.x += Math.cos(civ.wanderAngle) * 0.3;
        civ.y += Math.sin(civ.wanderAngle) * 0.3;

        // Bounds
        if (civ.x < 20) { civ.x = 20; civ.wanderAngle = 0; }
        if (civ.x > MAP_W - 20) { civ.x = MAP_W - 20; civ.wanderAngle = Math.PI; }
        if (civ.y < 20) { civ.y = 20; civ.wanderAngle = Math.PI / 2; }
        if (civ.y > MAP_H - 20) { civ.y = MAP_H - 20; civ.wanderAngle = -Math.PI / 2; }

        // Recruit check
        var recruitRange = def.recruitRange + ParadeController.getLength() * 5;
        var dx = PlayerController.x - civ.x;
        var dy = PlayerController.y - civ.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < recruitRange) {
          if (gameState.selectedChar === "merchant") {
            // Merchant: instant recruit with koku cost
            if (gameState.koku >= def.recruitCost) {
              gameState.koku -= def.recruitCost;
              ParadeController.addMember(civ.x, civ.y);
              EffectRenderer.add(civ.x, civ.y, "recruit");
              this.civilians.splice(i, 1);
            }
          } else {
            civ.recruitTimer += dt * 1000;
            if (civ.recruitTimer >= def.recruitTime) {
              ParadeController.addMember(civ.x, civ.y);
              EffectRenderer.add(civ.x, civ.y, "recruit");
              this.civilians.splice(i, 1);
            }
          }
        } else {
          civ.recruitTimer = 0;
        }
      }
    },

    draw: function(ctx) {
      var def = gameState.charDef;
      for (var i = 0; i < this.civilians.length; i++) {
        var civ = this.civilians[i];
        if (!CameraController.isVisible(civ.x, civ.y, 20)) { continue; }
        var sp = CameraController.worldToScreen(civ.x, civ.y);
        if (spritesLoaded) {
          var civFacingLeft = (Math.cos(civ.wanderAngle) < 0);
          drawSpriteCentered(ctx, "nomin_npc", sp.x, sp.y, 48, civFacingLeft);
        } else {
          ctx.font = FONT.civilian;
          ctx.textAlign = "center";
          ctx.fillText("\uD83D\uDC64", sp.x, sp.y + 4);
        }

        // Recruiting indicator
        var rdx = PlayerController.x - civ.x;
        var rdy = PlayerController.y - civ.y;
        var rDist = Math.sqrt(rdx * rdx + rdy * rdy);
        var effectiveRange = def.recruitRange + ParadeController.getLength() * 5;
        if (rDist < effectiveRange) {
          if (gameState.selectedChar === "merchant") { continue; }
          ctx.fillStyle = "#1a1a1a";
          ctx.font = FONT.h4;
          if (civ.recruitTimer > def.recruitTime * 0.5) {
            ctx.fillText("!", sp.x, sp.y - 12);
          } else {
            ctx.fillText("?", sp.x, sp.y - 12);
          }
          ctx.fillStyle = "rgba(0,0,0,0.3)";
          ctx.fillRect(sp.x - 10, sp.y - 20, 20 * (civ.recruitTimer / def.recruitTime), 3);
        }
      }
    }
  };

  // ============================================================
  // ParadeController (snake-style position history)
  // ============================================================
  var ParadeController = {
    members: [],
    positionHistory: [],

    init: function() {
      this.members = [];
      this.positionHistory = [];
    },

    addMember: function(x, y) {
      var member = { x: x, y: y, detached: false, attackCooldown: 0 };
      if (gameState.selectedChar === "ashigaru") {
        member.loyaltyTimer = 15 + Math.random() * 10;
      }
      this.members.push(member);
    },

    getLength: function() {
      return this.members.length;
    },

    update: function(dt) {
      // Record player position history
      this.positionHistory.push({ x: PlayerController.x, y: PlayerController.y });
      // Keep reasonable size
      var maxHistory = (this.members.length + 5) * HISTORY_SPACING;
      if (this.positionHistory.length > maxHistory) {
        this.positionHistory.splice(0, this.positionHistory.length - maxHistory);
      }

      // Apply ParadePhysics spacing based on terrain
      var spacing = ParadePhysics.getSpacing(PlayerController.x, PlayerController.y);

      // Update each member position from history + ashigaru leave timer
      for (var i = this.members.length - 1; i >= 0; i--) {
        var m = this.members[i];
        if (m.detached) { continue; }

        // Ashigaru follower loyalty timer
        if (gameState.selectedChar === "ashigaru" && m.loyaltyTimer !== undefined) {
          m.loyaltyTimer -= dt;
          if (m.loyaltyTimer <= 0) {
            var removed = this.members.splice(i, 1)[0];
            EffectRenderer.add(removed.x, removed.y, "surrender");
            CivilianManager.civilians.push({
              x: removed.x, y: removed.y,
              wanderAngle: Math.random() * Math.PI * 2,
              wanderTimer: 0,
              recruitTimer: 0
            });
            ScoreManager.recalculate();
            continue;
          }
        }

        var histIdx = this.positionHistory.length - 1 - ((i + 1) * spacing);
        if (histIdx < 0) { histIdx = 0; }
        if (histIdx >= this.positionHistory.length) { histIdx = this.positionHistory.length - 1; }
        var target = this.positionHistory[histIdx];
        if (target) {
          // Smooth follow (slower in river)
          var followSpeed = 0.2;
          if (TerrainManager.isInRiver(m.x, m.y)) {
            followSpeed = 0.06;
          }
          var dx = target.x - m.x;
          var dy = target.y - m.y;
          m.x += dx * followSpeed;
          m.y += dy * followSpeed;
        }

        // Parade member attack (all characters)
        if (m.attackCooldown > 0) { m.attackCooldown -= dt; }
        if (m.attackCooldown <= 0) {
          var paradeAttackRadius = 30;
          var paradeDamage = 3;
          if (gameState.selectedChar === "ashigaru") { paradeDamage = 2; }
          for (var ei = EnemyManager.enemies.length - 1; ei >= 0; ei--) {
            var en = EnemyManager.enemies[ei];
            if (en.surrendering) { continue; }
            var edx = m.x - en.x;
            var edy = m.y - en.y;
            var eDist = Math.sqrt(edx * edx + edy * edy);
            if (eDist < paradeAttackRadius) {
              en.hp -= paradeDamage;
              m.attackCooldown = 1.0;
              EffectRenderer.add(en.x, en.y, "hit");
              if (en.hp <= 0) {
                ScoreManager.addRaw(en.scoreValue);
                ShoninSystem.addKokuForKill(en.scoreValue);
                EffectRenderer.add(en.x, en.y, "destroy");
                EnemyManager.enemies.splice(ei, 1);
              }
              break;
            }
          }
        }
      }
    },

    draw: function(ctx) {
      var isIkki = (IkkiSystem.flashTimer > 0);
      for (var i = 0; i < this.members.length; i++) {
        var m = this.members[i];

  // ============================================================
  // ParadeChargeSystem
  // ============================================================
  var ParadeChargeSystem = {
    active: false,
    timer: 0,
    regroupTimer: 0,
    dirX: 0,
    dirY: 0,

    start: function() {
      if (ParadeController.getLength() < 3) {
        AnnouncementSystem.add("行列が短すぎる!");
        return;
      }
      if (this.active) { return; }
      if (this.regroupTimer > 0) { return; }
      if (PlayerController.chargeCooldown > 0) { return; }

      var dx = InputManager.mouseWorldX - PlayerController.x;
      var dy = InputManager.mouseWorldY - PlayerController.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 1) { dist = 1; }
      this.dirX = dx / dist;
      this.dirY = dy / dist;
      this.active = true;
      this.timer = 1.2;
      PlayerController.chargeCooldown = 6;
      AnnouncementSystem.add("行列突撃!!");
    },

    update: function(dt) {
      if (!this.active && this.regroupTimer <= 0) { return; }

      if (this.active) {
        this.timer -= dt;
        var chargeSpeed = 5 * gameState.charDef.chargeMultiplier;
        // Move all parade members toward charge direction
        for (var i = 0; i < ParadeController.members.length; i++) {
          var m = ParadeController.members[i];
          m.x += this.dirX * chargeSpeed;
          m.y += this.dirY * chargeSpeed;

          // Check collision with enemies
          for (var j = EnemyManager.enemies.length - 1; j >= 0; j--) {
            var en = EnemyManager.enemies[j];
            if (en.surrendering) { continue; }
            var edx = m.x - en.x;
            var edy = m.y - en.y;
            if (Math.sqrt(edx * edx + edy * edy) < en.size + 10) {
              en.hp -= gameState.charDef.attack * gameState.charDef.chargeMultiplier;
              EffectRenderer.add(en.x, en.y, "hit");
              if (en.hp <= 0) {
                ScoreManager.addRaw(en.scoreValue);
                ShoninSystem.addKokuForKill(en.scoreValue);
                EffectRenderer.add(en.x, en.y, "destroy");
                EnemyManager.enemies.splice(j, 1);
              }
            }
          }
        }

        if (this.timer <= 0) {
          this.active = false;
          this.regroupTimer = 3 * (1 - gameState.charDef.regroupSpeed + 0.5);
        }
      }

      if (this.regroupTimer > 0) {
        this.regroupTimer -= dt;
        // Regroup: members move back toward their history positions
        // (handled naturally by ParadeController.update)
      }
    }
  };
